<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Quiniela del Mundial 2026 · Fase eliminatoria · Pronósticos de partidos" />
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="⚽ Quiniela Mundial 2026" />
  <meta property="og:description" content="Haz tus pronósticos de la fase eliminatoria. ¿Quién será el campeón?" />
  <title>⚽ Quiniela Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep:  #0a1628;
      --green-field: #1a472a;
      --green-mid:   #2d6a4f;
      --gold:        #f4c430;
      --gold-dim:    #c9a227;
      --white:       #f5f5f0;
      --gray-1:      #1c1c2e;
      --gray-2:      #2a2a3e;
      --gray-3:      #3d3d55;
      --muted:       #8888aa;
      --danger:      #e05252;
      --success:     #4caf87;
      --blue:        #4a9eff;
      --r:           12px;
      --rs:          8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--green-deep); color: var(--white);
      min-height: 100vh; overflow-x: hidden;
    }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--gray-3); border-radius: 4px; }

    /* HEADER */
    .app-header {
      background: linear-gradient(135deg, var(--green-field) 0%, var(--green-deep) 100%);
      border-bottom: 2px solid var(--gold);
      padding: 16px 14px 12px; position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .logo { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--gold); line-height: 1; }
    .logo span { color: var(--white); }
    .user-badge {
      background: var(--gray-2); border: 1px solid var(--gray-3); border-radius: 20px;
      padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--white);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .user-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .nav-tabs { display: flex; gap: 5px; }
    .nav-tab {
      flex: 1; background: transparent; border: 1px solid var(--gray-3); border-radius: 20px;
      padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted);
      cursor: pointer; text-align: center; letter-spacing: 0.4px; transition: all 0.18s;
    }
    .nav-tab.active { background: var(--gold); border-color: var(--gold); color: var(--green-deep); }

    /* LAYOUT */
    .main { padding: 14px 13px 96px; max-width: 520px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; }
    .section-label {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 12px; letter-spacing: 3px; color: var(--gold); margin-bottom: 10px; padding: 0 2px;
    }


    /* MIS PICKS — acordeón por fase */
    .picks-accordion { margin-bottom: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--gray-2); }
    .picks-acc-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; background: var(--gray-2);
      cursor: pointer; user-select: none; gap: 10px;
    }
    .picks-acc-header:active { background: var(--gray-3); }
    .picks-acc-left  { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .picks-acc-phase {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 16px; letter-spacing: 1.5px; color: var(--gold); white-space: nowrap;
    }
    .picks-acc-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .picks-acc-chip  {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    }
    .chip-open   { background: rgba(76,175,135,.18);  color: var(--success); }
    .chip-done   { background: rgba(160,160,180,.13); color: var(--muted); }
    .chip-picks  { background: rgba(244,196,48,.15);  color: var(--gold); }
    .chip-missing{ background: rgba(224,82,82,.15);   color: var(--danger); }
    .picks-acc-arrow {
      font-size: 11px; color: var(--muted);
      transition: transform 0.2s; display: inline-block; flex-shrink: 0;
    }
    .picks-acc-arrow.open { transform: rotate(180deg); }
    .picks-acc-body { display: none; padding: 10px 10px 4px; background: var(--green-deep); }
    .picks-acc-body.open { display: block; }

    /* DAY GROUP */
    .day-group { margin-bottom: 18px; }
    .day-header { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .day-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .day-line { flex: 1; height: 1px; background: var(--gray-2); }

    /* MATCH CARD */
    .match-card {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--r); margin-bottom: 9px; overflow: hidden; transition: border-color 0.2s;
    }
    .match-card.saved  { border-color: var(--success); }
    .match-card.locked { border-color: var(--gray-3); opacity: 0.72; }
    .match-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px 6px; background: var(--gray-2); font-size: 11px;
    }
    .match-time { color: var(--gold); font-weight: 700; letter-spacing: 0.4px; }
    .match-status { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .status-open   { background: rgba(76,175,135,.18); color: var(--success); }
    .status-soon   { background: rgba(244,196,48,.18);  color: var(--gold); }
    .status-locked { background: rgba(160,160,180,.13); color: var(--muted); }
    .status-done   { background: rgba(76,175,135,.28);  color: var(--success); }
    .match-teams { display: flex; align-items: center; padding: 11px 12px 7px; gap: 8px; }
    .team { flex: 1; text-align: center; }
    .team-flag {
      display: inline-block; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 13px; letter-spacing: 1.5px; background: var(--gray-3); color: var(--white);
      border-radius: 5px; padding: 3px 7px 2px; margin-bottom: 5px; line-height: 1.2;
    }
    .team-name { font-size: 11px; font-weight: 700; color: var(--white); line-height: 1.2; }
    .vs-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .vs-text { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 17px; color: var(--gray-3); }
    .result-score { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }

    /* PICK CONTROLS */
    .prediction-area { padding: 0 12px 12px; }
    /* ot-row/ot-btn: mantenidos solo para vista admin en modal */
    .ot-row { display: flex; gap: 5px; margin-bottom: 7px; }
    .ot-btn {
      flex: 1; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 8px 4px; font-size: 11px; font-weight: 700;
      color: var(--muted); cursor: pointer; transition: all 0.14s; letter-spacing: 0.2px;
    }
    .ot-btn:active { transform: scale(0.95); }
    .ot-btn.sel-1 { border-color: var(--blue);   background: rgba(74,158,255,.15); color: var(--blue); }
    .ot-btn.sel-x { border-color: var(--gold);   background: rgba(244,196,48,.15); color: var(--gold); }
    .ot-btn.sel-2 { border-color: var(--danger); background: rgba(224,82,82,.15);  color: var(--danger); }
    /* OT derivado — badge informativo */
    .ot-derived {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-bottom: 7px;
      padding: 6px 10px; border-radius: var(--rs);
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
      background: var(--gray-2); border: 1.5px solid var(--gray-3);
    }
    .ot-derived.home { border-color: var(--blue);   background: rgba(74,158,255,.12); color: var(--blue); }
    .ot-derived.draw { border-color: var(--gold);   background: rgba(244,196,48,.12); color: var(--gold); }
    .ot-derived.away { border-color: var(--danger); background: rgba(224,82,82,.12);  color: var(--danger); }
    .ot-derived.empty { color: var(--muted); border-style: dashed; }
    /* Selector de clasificado (solo en empate) */
    .advance-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
      padding: 8px 10px; background: rgba(244,196,48,.06);
      border: 1px solid rgba(244,196,48,.25); border-radius: var(--rs);
    }
    .advance-label { font-size: 10px; color: var(--gold); font-weight: 700; white-space: nowrap; }
    .advance-btn {
      flex: 1; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: 6px; padding: 6px 4px; font-size: 10px; font-weight: 700;
      color: var(--muted); cursor: pointer; text-align: center; transition: all 0.14s;
    }
    .advance-btn.sel { border-color: var(--gold); background: rgba(244,196,48,.18); color: var(--gold); }
    .score-row { display: flex; align-items: center; gap: 6px; }
    .score-label { font-size: 10px; color: var(--muted); white-space: nowrap; font-weight: 600; }
    .score-inputs { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
    .score-input {
      width: 44px; height: 36px; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); color: var(--white); font-size: 18px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-input:focus { outline: none; border-color: var(--gold); }
    .score-sep { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gray-3); }
    .save-btn {
      background: var(--green-mid); border: none; border-radius: var(--rs);
      padding: 0 13px; height: 36px; color: var(--white); font-size: 12px;
      font-weight: 700; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .save-btn:active { background: var(--success); }
    .points-hint { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: right; }
    .points-hint b { color: var(--gold); }
    .locked-msg { padding: 9px 12px 12px; font-size: 11px; color: var(--muted); text-align: center; }
    .locked-msg .lock-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .my-pick-badge { display: flex; justify-content: center; gap: 8px; padding: 6px 12px 10px; font-size: 11px; }
    .pick-tag { background: var(--gray-2); border: 1px solid var(--gray-3); border-radius: 6px; padding: 3px 9px; font-weight: 700; color: var(--muted); }
    .pick-tag.ot-1 { border-color: var(--blue);   color: var(--blue); }
    .pick-tag.ot-x { border-color: var(--gold);   color: var(--gold); }
    .pick-tag.ot-2 { border-color: var(--danger); color: var(--danger); }
    .pick-tag.score { color: var(--white); }

    /* CHAMPION */
    .champion-section {
      background: linear-gradient(135deg, rgba(244,196,48,.07) 0%, transparent 100%);
      border: 2px solid var(--gold-dim); border-radius: var(--r); padding: 15px; margin-bottom: 18px;
    }
    .champion-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 21px; color: var(--gold); letter-spacing: 2px; margin-bottom: 3px; }
    .champion-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 13px; line-height: 1.4; }
    .champion-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; margin-bottom: 11px; }
    .champ-btn {
      background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 8px 4px 6px; cursor: pointer; text-align: center; transition: all 0.14s;
    }
    .champ-btn:active { transform: scale(0.91); }
    .champ-btn.selected { border-color: var(--gold); background: rgba(244,196,48,.13); }
    .champ-btn.locked-champ { opacity: 0.45; cursor: not-allowed; }
    .champ-flag {
      display: inline-block; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 11px; letter-spacing: 1px; background: var(--gray-3); color: var(--white);
      border-radius: 4px; padding: 2px 5px 1px; margin-bottom: 4px; line-height: 1.3; border: 1px solid var(--gray-3);
    }
    .champ-btn.selected .champ-flag { background: rgba(244,196,48,.18); border-color: var(--gold); color: var(--gold); }
    .champ-name { font-size: 8px; font-weight: 700; color: var(--muted); margin-top: 2px; line-height: 1; }
    .champ-btn.selected .champ-name { color: var(--gold); }
    .save-champ-btn {
      width: 100%; background: var(--gold); border: none; border-radius: var(--rs);
      padding: 11px; font-size: 14px; font-weight: 700; color: var(--green-deep);
      cursor: pointer; letter-spacing: 0.4px; transition: opacity 0.18s;
    }
    .save-champ-btn:disabled { opacity: 0.38; cursor: not-allowed; }



    /* STATS — acordeón por partido */
    .stats-match-acc {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--r); margin-bottom: 8px; overflow: hidden;
    }
    .stats-match-acc-header {
      padding: 10px 12px; cursor: pointer; user-select: none;
      transition: background 0.15s;
    }
    .stats-match-acc-header:active { background: var(--gray-2); }
    .stats-match-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .stats-match-teams { font-size: 12px; font-weight: 700; color: var(--white); }
    .stats-match-meta  { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .stats-match-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stats-match-scorebox {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 18px; color: var(--gold); line-height: 1;
      background: var(--gray-2); border-radius: 6px;
      padding: 3px 10px; white-space: nowrap;
    }
    .stats-match-scorebox.pending { font-size: 11px; color: var(--muted); padding: 5px 10px; }
    .stats-match-acc-arrow {
      font-size: 11px; color: var(--muted);
      transition: transform 0.2s; display: inline-block;
    }
    .stats-match-acc-arrow.open { transform: rotate(180deg); }
    /* Picks count chips en el header */
    .stats-match-chips { display: flex; gap: 4px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
    .stats-cnt-chip {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 8px; white-space: nowrap;
    }
    .cnt-home { background: rgba(74,158,255,.15);  color: var(--blue); }
    .cnt-draw { background: rgba(244,196,48,.15);  color: var(--gold); }
    .cnt-away { background: rgba(224,82,82,.15);   color: var(--danger); }
    .cnt-none { background: rgba(160,160,180,.12); color: var(--muted); }
    /* Cuerpo del acordeón de partido */
    .stats-match-acc-body {
      display: none; border-top: 1px solid var(--gray-2);
      padding: 10px 12px 12px; background: var(--gray-2);
    }
    .stats-match-acc-body.open { display: block; }
    /* Tabla de picks en acordeón */
    .stats-picks-table {
      display: grid;
      grid-template-columns: 1fr 44px 54px 28px;
      gap: 3px 6px; font-size: 11px; align-items: center;
    }
    .stats-picks-table-header span {
      font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px;
    }


    /* ─── CAMBIO DE POSICIÓN ─────────────────────────────────── */
    .rank-change-toast {
      position: fixed; top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--gray-1); border-radius: var(--r);
      padding: 14px 20px; z-index: 998; opacity: 0;
      transition: all 0.35s; pointer-events: none;
      border: 2px solid var(--gray-3); text-align: center;
      min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .rank-change-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .rank-change-icon  { font-size: 28px; display: block; margin-bottom: 4px; }
    .rank-change-text  { font-size: 13px; font-weight: 700; color: var(--white); }
    .rank-change-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rank-change-toast.up   { border-color: var(--success); }
    .rank-change-toast.down { border-color: var(--danger); }
    .rank-change-toast.same { border-color: var(--gold); }

    /* ─── PERFIL PROPIO EN RANKING ───────────────────────────── */
    .my-profile-btn {
      width: 100%; background: var(--gray-2); border: 1px solid var(--gray-3);
      border-radius: var(--rs); padding: 10px 14px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: border-color 0.15s; text-align: left;
    }
    .my-profile-btn:active { border-color: var(--gold); }
    .my-profile-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green-field), var(--green-mid));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 18px; color: var(--gold); flex-shrink: 0;
    }
    .my-profile-info { flex: 1; min-width: 0; }
    .my-profile-name { font-size: 14px; font-weight: 700; color: var(--white); }
    .my-profile-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .my-profile-pts  {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 24px; color: var(--gold); line-height: 1; flex-shrink: 0;
    }

    /* ─── MARCADOR POPULAR ───────────────────────────────────── */
    .popular-score-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(244,196,48,.12); border: 1px solid rgba(244,196,48,.25);
      border-radius: 8px; padding: 3px 9px; font-size: 10px;
      color: var(--gold); font-weight: 700; margin-top: 4px;
    }

    /* ─── ADMIN: AGREGAR PARTIDO ─────────────────────────────── */
    .add-match-form {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--r); padding: 14px; margin-bottom: 10px;
    }
    .add-match-form-title {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 14px; color: var(--gold); letter-spacing: 1px; margin-bottom: 12px;
    }
    .add-match-input {
      width: 100%; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 10px 12px; color: var(--white);
      font-size: 13px; margin-bottom: 8px;
    }
    .add-match-input:focus { outline: none; border-color: var(--gold); }
    .add-match-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .add-match-row .add-match-input { margin-bottom: 0; }
    .add-match-btn {
      width: 100%; background: var(--green-mid); border: none;
      border-radius: var(--rs); padding: 11px; color: var(--white);
      font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px;
      transition: background 0.15s;
    }
    .add-match-btn:active { background: var(--success); }

    /* ─── COUNTDOWN ─────────────────────────────────────────────── */
    .match-countdown {
      font-size: 10px; font-weight: 700; color: var(--gold);
      letter-spacing: 0.3px; font-variant-numeric: tabular-nums;
    }
    .match-countdown.urgent { color: var(--danger); animation: pulse 1s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

    /* ─── RACHA ──────────────────────────────────────────────────── */
    .streak-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; background: rgba(244,196,48,.15);
      color: var(--gold); border: 1px solid rgba(244,196,48,.3);
      white-space: nowrap;
    }
    .streak-badge.fire { background: rgba(224,100,50,.18); color: #ff7043; border-color: rgba(224,100,50,.35); }

    /* ─── STATS ──────────────────────────────────────────────────── */
    .stats-match-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
    .stats-match-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--gray-2); font-size: 11px; }
    .stats-match-title { font-weight: 700; color: var(--white); }
    .stats-match-result { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 16px; color: var(--gold); }
    .stats-body { padding: 10px 12px 12px; }
    .stats-bars { display: flex; gap: 5px; margin-bottom: 8px; }
    .stats-bar-block { flex: 1; }
    .stats-bar-label { font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 3px; text-align: center; }
    .stats-bar-track { height: 6px; background: var(--gray-3); border-radius: 3px; overflow: hidden; margin-bottom: 3px; }
    .stats-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
    .fill-home { background: var(--blue); }
    .fill-draw { background: var(--gold); }
    .fill-away { background: var(--danger); }
    .stats-bar-pct { font-size: 10px; font-weight: 700; text-align: center; }
    .fill-home-txt { color: var(--blue); } .fill-draw-txt { color: var(--gold); } .fill-away-txt { color: var(--danger); }
    .stats-picks-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 2px 6px; font-size: 10px; align-items: center; }
    .stats-pick-name { color: var(--white); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats-pick-ot   { font-weight: 700; text-align: center; }
    .stats-pick-sc   { color: var(--muted); text-align: center; }
    .stats-pick-pts  { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 14px; color: var(--gold); text-align: right; }
    .stats-pick-pts.zero { color: var(--gray-3); }
    .stats-champ-section { margin-bottom: 16px; }
    .stats-champ-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .stats-champ-item { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 8px 6px; text-align: center; }
    .stats-champ-flag { display: inline-block; font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 11px; background: var(--gray-3); color: var(--white); border-radius: 4px; padding: 2px 5px; margin-bottom: 4px; }
    .stats-champ-name { font-size: 8px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .stats-champ-count { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 20px; color: var(--gold); line-height: 1; }
    .stats-champ-lbl { font-size: 8px; color: var(--muted); }
    .stats-global-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin-bottom: 16px; }
    .stats-global-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 12px 10px; text-align: center; }
    .stats-global-val { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 28px; color: var(--gold); line-height: 1; margin-bottom: 2px; }
    .stats-global-lbl { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
    .stats-accordion { margin-bottom: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--gray-2); }
    .stats-acc-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; background: var(--gray-2); cursor: pointer; user-select: none; }
    .stats-acc-phase { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 15px; letter-spacing: 1.5px; color: var(--gold); }
    .stats-acc-meta { font-size: 10px; color: var(--muted); }
    .stats-acc-arrow { font-size: 11px; color: var(--muted); transition: transform .2s; display: inline-block; }
    .stats-acc-arrow.open { transform: rotate(180deg); }
    .stats-acc-body { display: none; padding: 10px; background: var(--green-deep); }
    .stats-acc-body.open { display: block; }

    /* RANKING */
    .ranking-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 14px; }
    .rank-stat { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 10px 8px; text-align: center; }
    .rank-stat-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 26px; color: var(--gold); line-height: 1; }
    .rank-stat-label { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; margin-top: 2px; }
    .podium-row { display: flex; align-items: stretch; gap: 6px; margin-bottom: 14px; }
    .podium-card { flex: 1; background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--r); padding: 12px 8px; text-align: center; }
    .podium-card.p1 { border-color: #ffd700; background: rgba(255,215,0,.05); }
    .podium-card.p2 { border-color: #c0c0c0; background: rgba(192,192,192,.04); }
    .podium-card.p3 { border-color: #cd7f32; background: rgba(205,127,50,.04); }
    .podium-medal { font-size: 22px; display: block; margin-bottom: 4px; }
    .podium-name { font-size: 12px; font-weight: 700; color: var(--white); line-height: 1.2; margin-bottom: 3px; word-break: break-word; }
    .podium-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 28px; color: var(--gold); line-height: 1; }
    .podium-pts-lbl { font-size: 9px; color: var(--muted); }
    .podium-champ { font-size: 9px; color: var(--muted); margin-top: 4px; }
    .ranking-list { margin-top: 4px; }
    .ranking-row {
      display: flex; align-items: center; background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--rs); padding: 9px 12px; margin-bottom: 5px; gap: 10px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .ranking-row.me { border-color: var(--gold); background: rgba(244,196,48,.04); }
    .ranking-row.expanded { border-radius: var(--rs) var(--rs) 0 0; border-bottom-color: transparent; }
    .rank-pos { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gray-3); width: 22px; text-align: center; flex-shrink: 0; }
    .rank-pos.top { color: var(--gold); }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .rank-pts-block { text-align: right; flex-shrink: 0; }
    .rank-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }
    .rank-pts-lbl { font-size: 9px; color: var(--muted); }
    .rank-detail {
      display: none; background: var(--gray-2); border: 1px solid var(--gray-2); border-top: none;
      border-radius: 0 0 var(--rs) var(--rs); padding: 8px 12px 10px; margin-bottom: 5px;
    }
    .rank-detail.open { display: block; }
    .detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-bottom: 8px; }
    .detail-cell { background: var(--gray-1); border-radius: 6px; padding: 7px 6px; text-align: center; }
    .detail-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gold); line-height: 1; }
    .detail-lbl { font-size: 9px; color: var(--muted); margin-top: 1px; }
    .detail-picks-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
    .detail-pick-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--gray-3); font-size: 11px; }
    .detail-pick-row:last-child { border-bottom: none; }
    .detail-pick-match { color: var(--muted); flex: 1; }
    .detail-pick-sel { font-weight: 700; width: 40px; text-align: center; }
    .detail-pick-score { color: var(--muted); width: 44px; text-align: center; }
    .detail-pick-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 15px; color: var(--gold); width: 24px; text-align: right; }
    .detail-pick-pts.zero { color: var(--gray-3); }

    /* ADMIN */
    .admin-section { margin-bottom: 20px; }
    .admin-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 16px; color: var(--gold); letter-spacing: 2px; margin-bottom: 10px; }
    .admin-match-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--r); padding: 13px; margin-bottom: 7px; }
    .admin-match-card.done-card { border-color: var(--success); }
    .admin-match-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; color: var(--white); }
    .admin-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .admin-label { font-size: 10px; color: var(--muted); min-width: 78px; font-weight: 600; letter-spacing: 0.4px; }
    .admin-score-input {
      width: 44px; height: 36px; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); color: var(--white); font-size: 18px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .admin-score-input::-webkit-outer-spin-button,
    .admin-score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .admin-score-input:focus { outline: none; border-color: var(--gold); }
    .admin-select { flex: 1; background: var(--gray-2); border: 1.5px solid var(--gray-3); border-radius: var(--rs); color: var(--white); font-size: 13px; padding: 8px; }
    .admin-select:focus { outline: none; border-color: var(--gold); }
    .admin-footer { display: flex; gap: 7px; align-items: center; margin-top: 4px; }
    .admin-save-btn { flex: 1; background: var(--green-mid); border: none; border-radius: var(--rs); padding: 9px 14px; color: var(--white); font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.18s; }
    .admin-save-btn:active { background: var(--success); }
    .admin-picks-summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray-2); }
    .admin-picks-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 5px; }
    .admin-pick-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--gray-2); gap: 2px; }
    .admin-pick-row:last-child { border-bottom: none; }
    .admin-pick-name { flex: 1; color: var(--white); }
    .admin-pick-ot  { width: 30px; text-align: center; font-weight: 700; flex-shrink: 0; }
    .admin-pick-sc  { width: 48px; text-align: center; color: var(--muted); flex-shrink: 0; }
    .admin-pick-adv { width: 32px; text-align: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .admin-pick-pts { width: 26px; text-align: right; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 15px; color: var(--gold); flex-shrink: 0; }
    .admin-pick-pts.zero { color: var(--gray-3); }

    /* PARTICIPANTS */
    .participants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .participant-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 11px 12px; cursor: pointer; transition: border-color 0.15s; }
    .participant-card:active { border-color: var(--gray-3); }
    .participant-card.admin-user { border-color: var(--gold-dim); }
    .participant-name { font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .participant-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 10px; margin-bottom: 6px; }
    .participant-badge.admin { background: rgba(244,196,48,.18); color: var(--gold); }
    .participant-badge.user  { background: rgba(76,175,135,.15); color: var(--success); }
    .participant-champ { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .participant-champ b { color: var(--white); }
    .participant-progress { display: flex; gap: 3px; flex-wrap: wrap; }
    .prog-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .prog-dot.done-correct { background: var(--success); }
    .prog-dot.done-wrong   { background: var(--danger); }
    .prog-dot.has-pick     { background: var(--green-mid); }
    .prog-dot.no-pick      { background: var(--gray-3); }
    .participant-stats { display: flex; gap: 6px; margin-top: 7px; border-top: 1px solid var(--gray-2); padding-top: 6px; }
    .pstat { flex: 1; text-align: center; }
    .pstat-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 18px; color: var(--gold); line-height: 1; }
    .pstat-lbl { font-size: 8px; color: var(--muted); margin-top: 1px; }



    /* ADMIN — acordeón resultados */
    .admin-accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; padding: 10px 13px;
      background: var(--gray-2); border-radius: var(--rs);
      margin-bottom: 6px; user-select: none;
      border: 1px solid var(--gray-3); transition: border-color 0.15s;
    }
    .admin-accordion-header:active { border-color: var(--gold); }
    .admin-accordion-left { display: flex; align-items: center; gap: 8px; }
    .admin-accordion-phase {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 14px; letter-spacing: 1.5px; color: var(--gold);
    }
    .admin-accordion-meta { font-size: 10px; color: var(--muted); }
    .admin-accordion-right { display: flex; align-items: center; gap: 8px; }
    .admin-accordion-pts {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 11px; color: var(--muted);
    }
    .admin-accordion-arrow {
      font-size: 11px; color: var(--muted);
      transition: transform 0.2s; display: inline-block;
    }
    .admin-accordion-arrow.open { transform: rotate(180deg); }
    .admin-accordion-body { display: none; }
    .admin-accordion-body.open { display: block; }

    /* ADMIN — eliminar participante */
    .participant-card { position: relative; }
    .delete-user-btn {
      position: absolute; top: 8px; right: 8px;
      background: transparent; border: none;
      color: var(--muted); font-size: 14px; cursor: pointer;
      width: 22px; height: 22px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%;
      transition: all 0.15s; line-height: 1;
    }
    .delete-user-btn:hover { background: rgba(224,82,82,.18); color: var(--danger); }
    .participant-card.confirm-delete { border-color: var(--danger) !important; background: rgba(224,82,82,.07); }
    .confirm-delete-bar {
      display: flex; gap: 5px; margin-top: 8px; padding-top: 8px;
      border-top: 1px solid rgba(224,82,82,.3);
    }
    .confirm-yes-btn {
      flex: 1; background: var(--danger); border: none; border-radius: 6px;
      padding: 6px 4px; font-size: 10px; font-weight: 700; color: var(--white);
      cursor: pointer; letter-spacing: 0.3px;
    }
    .confirm-no-btn {
      flex: 1; background: var(--gray-2); border: 1px solid var(--gray-3);
      border-radius: 6px; padding: 6px 4px; font-size: 10px; font-weight: 700;
      color: var(--muted); cursor: pointer;
    }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 500; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: var(--gray-1); border-radius: 18px 18px 0 0; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 0 0 32px; animation: slideUp .22s ease; }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 36px; height: 4px; background: var(--gray-3); border-radius: 2px; margin: 12px auto 16px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px; border-bottom: 1px solid var(--gray-2); margin-bottom: 12px; }
    .modal-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 1px; }
    .modal-close { background: var(--gray-2); border: none; border-radius: 50%; width: 30px; height: 30px; color: var(--white); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 0 16px; }
    .modal-champ-row { background: var(--gray-2); border-radius: var(--rs); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .modal-champ-icon { font-size: 22px; }
    .modal-champ-text { font-size: 13px; }
    .modal-champ-text b { color: var(--gold); }
    .modal-pick-row { display: grid; grid-template-columns: 1fr 54px 54px 28px; align-items: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--gray-2); font-size: 11px; }
    .modal-pick-row:last-child { border-bottom: none; }
    .modal-pick-match { color: var(--muted); font-size: 10px; }
    .modal-pick-match b { color: var(--white); font-size: 11px; }
    .modal-pick-ot { font-weight: 700; text-align: center; }
    .modal-pick-sc { color: var(--muted); text-align: center; }
    .modal-pick-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 16px; color: var(--gold); text-align: right; }
    .modal-pick-pts.zero { color: var(--gray-3); }
    .modal-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 14px; background: var(--gray-2); border-radius: var(--rs); }
    .modal-total-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .modal-total-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 30px; color: var(--gold); line-height: 1; }

    /* RECALC */
    .recalc-btn { width: 100%; background: var(--gold); border: none; border-radius: var(--rs); padding: 13px; font-size: 14px; font-weight: 700; color: var(--green-deep); cursor: pointer; margin-top: 6px; letter-spacing: 0.3px; }


    /* ADMIN EDIT en modal */
    .modal-edit-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; margin-top: 4px;
    }
    .modal-edit-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .modal-edit-badge {
      font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      background: rgba(244,196,48,.15); color: var(--gold); letter-spacing: 0.5px;
    }
    .modal-pick-edit-row {
      background: var(--gray-2); border-radius: var(--rs);
      padding: 10px 10px 8px; margin-bottom: 6px;
    }
    .modal-pick-edit-match {
      font-size: 11px; font-weight: 700; color: var(--white); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-pick-edit-match span { font-size: 10px; color: var(--muted); font-weight: 400; }
    .modal-pick-edit-pts {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 18px; color: var(--gold);
    }
    .modal-pick-edit-pts.zero { color: var(--gray-3); }
    .edit-ot-row { display: flex; gap: 4px; margin-bottom: 7px; }
    .edit-ot-btn {
      flex: 1; background: var(--gray-1); border: 1.5px solid var(--gray-3);
      border-radius: 6px; padding: 6px 2px; font-size: 10px; font-weight: 700;
      color: var(--muted); cursor: pointer; transition: all 0.12s; text-align: center;
    }
    .edit-ot-btn.sel-1 { border-color: var(--blue);   background: rgba(74,158,255,.18); color: var(--blue); }
    .edit-ot-btn.sel-x { border-color: var(--gold);   background: rgba(244,196,48,.18); color: var(--gold); }
    .edit-ot-btn.sel-2 { border-color: var(--danger); background: rgba(224,82,82,.18);  color: var(--danger); }
    .edit-score-row { display: flex; align-items: center; gap: 6px; }
    .edit-score-label { font-size: 9px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .edit-score-inputs { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
    .edit-score-input {
      width: 40px; height: 32px; background: var(--gray-1); border: 1.5px solid var(--gray-3);
      border-radius: 6px; color: var(--white); font-size: 16px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .edit-score-input::-webkit-outer-spin-button,
    .edit-score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .edit-score-input:focus { outline: none; border-color: var(--gold); }
    .edit-score-sep { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 18px; color: var(--gray-3); }
    .edit-save-btn {
      background: var(--green-mid); border: none; border-radius: 6px;
      padding: 0 10px; height: 32px; color: var(--white); font-size: 11px;
      font-weight: 700; cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    .edit-save-btn:active { background: var(--success); }
    .edit-clear-btn {
      background: transparent; border: 1px solid var(--gray-3); border-radius: 6px;
      padding: 0 8px; height: 32px; color: var(--muted); font-size: 11px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .modal-champ-edit-row {
      background: var(--gray-2); border-radius: var(--rs); padding: 10px 12px; margin-bottom: 14px;
    }
    .modal-champ-edit-label { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .champ-edit-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; margin-bottom: 8px; }
    .champ-edit-btn {
      background: var(--gray-1); border: 1.5px solid var(--gray-3); border-radius: 6px;
      padding: 6px 3px; cursor: pointer; text-align: center; transition: all 0.12s;
    }

/* ═══════════════════════════════════════════════════════════════
   SUPABASE API
═══════════════════════════════════════════════════════════════ */
const SB_HEADERS = () => ({
  "Content-Type":  "application/json",
  "apikey":        CONFIG.SUPABASE_ANON,
  "Authorization": `Bearer ${CONFIG.SUPABASE_ANON}`,
  "Prefer":        "return=representation",
});

const supabase = {
  async get(table, query = "") {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, { headers: SB_HEADERS() });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async upsert(table, data) {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
      method: "POST",
      headers: { ...SB_HEADERS(), "Prefer": "resolution=merge-duplicates,return=representation" },
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async patch(table, query, data) {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, {
      method: "PATCH",
      headers: SB_HEADERS(),
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
};

/* ═══════════════════════════════════════════════════════════════
   ESTADO GLOBAL  (cache en memoria, fuente de verdad = Supabase)
═══════════════════════════════════════════════════════════════ */
let currentUser  = null;
let DB = {
  users:          [],   // [{ id, name, is_admin, champion }]
  matches:        [],   // MATCHES enriquecidos con result/done desde Supabase
  picks:          [],   // [{ user_id, match_id, ot, home_score, away_score }]
  championWinner: null,
};

/* ═══════════════════════════════════════════════════════════════
   CARGA INICIAL DESDE SUPABASE
═══════════════════════════════════════════════════════════════ */
async function loadAll() {
  // No muestra loading aquí — el llamador decide cuándo mostrarlo
  const [users, matchResults, picks, settings, extraMatches] = await Promise.all([
    supabase.get("users", "?order=created_at"),
    supabase.get("match_results", "?select=*"),
    supabase.get("picks", "?select=*"),
    supabase.get("settings", "?select=*"),
    supabase.get("extra_matches", "?select=*").catch(() => []),  // tabla opcional
  ]);

  DB.users = users;

  const resultMap = Object.fromEntries(matchResults.map(r => [r.match_id, r]));

  // Fixture base (hardcoded)
  const baseMatches = MATCHES.map(m => {
    const r = resultMap[m.id];
    return {
      ...m,
      result: r ? { homeScore: r.home_score, awayScore: r.away_score } : null,
      winner: r?.winner || null,
      done:   r?.done   || false,
    };
  });

  // Partidos extra creados desde el admin
  const extraConverted = (extraMatches || []).map(e => {
    const r = resultMap[e.match_id];
    return {
      id:       e.match_id,
      phase:    e.phase,
      day:      e.day,
      timeISO:  e.time_iso,
      home:     e.home,      homeFlag: e.home_flag,
      away:     e.away,      awayFlag: e.away_flag,
      result:   r ? { homeScore: r.home_score, awayScore: r.away_score } : null,
      winner:   r?.winner || null,
      done:     r?.done   || false,
    };
  });

  // Merge: base + extra (sin duplicados por id)
  const extraIds = new Set(extraConverted.map(m => m.id));
  DB.matches = [
    ...baseMatches.filter(m => !extraIds.has(m.id)),
    ...extraConverted,
  ].sort((a,b) => new Date(a.timeISO) - new Date(b.timeISO));

  DB.picks = picks;

  const champSetting = settings.find(s => s.key === "champion_winner");
  DB.championWinner  = champSetting?.value || null;
}

/* ═══════════════════════════════════════════════════════════════
   TIEMPO
═══════════════════════════════════════════════════════════════ */
function isLocked(match)  { return (new Date(match.timeISO) - new Date()) / 60000 <= CONFIG.LOCK_MINUTES; }
function isStarted(match) { return (new Date(match.timeISO) - new Date()) / 60000 <= 0; }

function getStatus(match) {
  if (match.done)         return { label:"FINALIZADO",  cls:"status-done" };
  if (isLocked(match))    return { label:"CERRADO 🔒",  cls:"status-locked" };
  const diff = (new Date(match.timeISO) - new Date()) / 60000;
  if (diff <= 60)         return { label:"¡PRONTO!",    cls:"status-soon" };
  return                         { label:"ABIERTO ✓",   cls:"status-open" };
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit", timeZone:"America/Santiago" });
}

/* ═══════════════════════════════════════════════════════════════
   PUNTUACIÓN
═══════════════════════════════════════════════════════════════ */
function calcPickPts(pick, match) {
  if (!match.done || !match.result || pick?.home_score === null || pick?.home_score === undefined)
    return { ot:0, exact:0, advance:0, total:0 };
  const { homeScore:rh, awayScore:ra } = match.result;
  const realOT  = rh > ra ? "1" : rh === ra ? "X" : "2";

  // OT derivado del marcador apostado
  const ph = parseInt(pick.home_score), pa = parseInt(pick.away_score);
  if (isNaN(ph) || isNaN(pa)) return { ot:0, exact:0, advance:0, total:0 };
  const pickOT  = ph > pa ? "1" : ph === pa ? "X" : "2";

  const otOk    = pickOT === realOT;
  const exactOk = ph === rh && pa === ra;

  // Clasificado: si el marcador fue empate, se usa pick.advance; si no, el OT lo define
  let advanceOk = false;
  if (pickOT === "X") {
    // Empate apostado: el clasificado debe coincidir con match.winner
    const realWinner = match.winner; // 'home' | 'away'
    advanceOk = realWinner && pick.advance === realWinner;
  } else {
    // No empate: el clasificado es el equipo que el marcador indica ganador
    const pickWinner = ph > pa ? "home" : "away";
    advanceOk = otOk && pickWinner === match.winner;
  }

  const pts_ot      = otOk      ? 1 : 0;
  const pts_exact   = exactOk   ? 3 : 0;
  const pts_advance = advanceOk ? 1 : 0;
  return { ot: pts_ot, exact: pts_exact, advance: pts_advance, total: pts_ot + pts_exact + pts_advance };
}

function calcUserStats(user) {
  let totPts = 0, totOT = 0, totExact = 0, totAdvance = 0, totChamp = 0;
  DB.matches.forEach(m => {
    if (!m.done) return;
    const pick = DB.picks.find(p => p.user_id === user.id && p.match_id === m.id);
    const p    = calcPickPts(pick, m);
    totOT += p.ot; totExact += p.exact; totAdvance += p.advance; totPts += p.total;
  });
  if (DB.championWinner && user.champion === DB.championWinner) { totChamp = 5; totPts += 5; }
  return { pts: totPts, ot: totOT, exact: totExact, advance: totAdvance, champ: totChamp };
}

function calcRanking() {
  return DB.users
    .map(u => ({ ...u, ...calcUserStats(u) }))
    .sort((a, b) =>
      b.pts     - a.pts     ||          // 1º mayor puntaje
      b.exact   - a.exact   ||          // 2º más marcadores exactos (cada uno vale 3)
      b.ot      - a.ot      ||          // 3º más resultados 1X2 correctos
      a.name.localeCompare(b.name)      // 4º alfabético como último recurso
    );
}

/* ═══════════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════════ */
async function doLogin() {
  const name = document.getElementById("loginName").value.trim();
  const code = document.getElementById("loginCode").value.trim().toLowerCase();

  if (!name) { showToast("Ingresa tu nombre", "error"); return; }
  if (code !== CONFIG.GROUP_CODE.toLowerCase() && code !== CONFIG.ADMIN_CODE.toLowerCase()) {
    showToast("Código incorrecto", "error"); return;
  }

  const isAdmin = code === CONFIG.ADMIN_CODE.toLowerCase();
  const btn = document.querySelector(".login-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Conectando..."; }

  try {
    // Recarga usuarios frescos antes de buscar
    const users = await supabase.get("users", "?order=created_at");
    DB.users = users;

    const existing = DB.users.find(u => u.name.toLowerCase() === name.toLowerCase());
    if (!existing) {
      const result = await supabase.upsert("users", { name, is_admin: isAdmin });
      const created = Array.isArray(result) ? result[0] : result;
      if (!created?.id) throw new Error("No se pudo crear el usuario");
      DB.users.push(created);
      currentUser = created;
    } else {
      currentUser = { ...existing };
      if (isAdmin && !existing.is_admin) {
        await supabase.patch("users", `?id=eq.${existing.id}`, { is_admin: true });
        currentUser.is_admin = true;
      }
    }

    sessionStorage.setItem("qm26_uid", currentUser.id);

    // Carga el resto de datos antes de mostrar la app
    showLoading("Cargando datos...");
    await loadAll();
    hideLoading();
    bootApp();

  } catch(e) {
    hideLoading();
    if (btn) { btn.disabled = false; btn.textContent = "ENTRAR A LA QUINIELA →"; }
    showToast("Error al conectar. Intenta de nuevo.", "error");
    console.error("doLogin error:", e);
  }
}


/* ═══════════════════════════════════════════════════════════════
   COUNTDOWN — formatea el tiempo hasta el partido
═══════════════════════════════════════════════════════════════ */
function fmtCountdown(match) {
  const diff = (new Date(match.timeISO) - new Date()) / 1000; // segundos
  if (diff <= 0 || match.done) return `🕐 ${fmtTime(match.timeISO)}`;
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  if (h > 48) return `🕐 ${fmtTime(match.timeISO)}`;        // más de 2 días → hora normal
  if (h >= 1)  return `⏱ ${h}h ${m}m`;
  return `⏱ ${m}m ${Math.floor(diff % 60)}s`;
}

// Tick global: actualiza todos los countdowns cada segundo
let _cdTick = null;
function startCountdownTick() {
  if (_cdTick) return;
  _cdTick = setInterval(() => {
    DB.matches.forEach(m => {
      const el = document.getElementById(`cd_${m.id}`);
      if (!el) return;
      const diff = (new Date(m.timeISO) - new Date()) / 1000;
      el.textContent = fmtCountdown(m);
      // Urgente: menos de 30 min para cerrar (LOCK_MINUTES + 15 extra)
      el.classList.toggle("urgent", diff > 0 && diff < (CONFIG.LOCK_MINUTES + 15) * 60);
    });
  }, 1000);
}

/* ═══════════════════════════════════════════════════════════════
   RACHA — aciertos consecutivos de resultados (1X2)
═══════════════════════════════════════════════════════════════ */
function calcStreak(user) {
  // Solo partidos finalizados, en orden cronológico
  const played = DB.matches
    .filter(m => m.done && m.result)
    .sort((a,b) => new Date(a.timeISO) - new Date(b.timeISO));

  let streak = 0;
  for (let i = played.length - 1; i >= 0; i--) {
    const m    = played[i];
    const pick = DB.picks.find(p => p.user_id === user.id && p.match_id === m.id);
    if (!pick?.ot) break;                                   // sin pick → corta la racha
    const { homeScore:rh, awayScore:ra } = m.result;
    const realOT = rh > ra ? "1" : rh === ra ? "X" : "2";
    const ph = parseInt(pick.home_score), pa = parseInt(pick.away_score);
    const pickOT = isNaN(ph)||isNaN(pa) ? null : ph>pa?"1":ph===pa?"X":"2";
    if (pickOT === realOT) streak++;
    else break;
  }
  return streak;
}

/* ═══════════════════════════════════════════════════════════════
   ESTADÍSTICAS DEL GRUPO
═══════════════════════════════════════════════════════════════ */
function renderStats() {
  const phaseOrder  = ["16vos","8vos","Cuartos","Semis","Final","General"];
  const phases      = [...new Set(DB.matches.map(m => m.phase || "General"))];
  phases.sort((a,b) => phaseOrder.indexOf(a) - phaseOrder.indexOf(b));

  const totalPicks  = DB.picks.filter(p => p.ot).length;
  const totalUsers  = DB.users.length;
  const playedCount = DB.matches.filter(m => m.done).length;
  const avgPts      = totalUsers
    ? (DB.users.reduce((s,u) => s + calcUserStats(u).pts, 0) / totalUsers).toFixed(1)
    : 0;

  // Campeones apostados
  const champMap = {};
  DB.users.forEach(u => { if (u.champion) champMap[u.champion] = (champMap[u.champion]||0) + 1; });
  const champSorted = Object.entries(champMap).sort((a,b) => b[1]-a[1]).slice(0,8);
  const champGrid = champSorted.length === 0
    ? `<div style="font-size:12px;color:var(--muted)">Nadie ha elegido campeón aún.</div>`
    : champSorted.map(([id, cnt]) => {
        const t = CHAMPION_TEAMS.find(t => t.id === id);
        return `<div class="stats-champ-item">
          <span class="stats-champ-flag">${id}</span>
          <div class="stats-champ-name">${t?.name||id}</div>
          <div class="stats-champ-count">${cnt}</div>
          <div class="stats-champ-lbl">${cnt===1?"voto":"votos"}</div>
        </div>`;
      }).join("");

  // Acordeones por fase → dentro cada partido es otro acordeón
  const phaseAccordions = phases.map(phase => {
    const pMatches  = DB.matches.filter(m => (m.phase||"General") === phase);
    const doneCnt   = pMatches.filter(m => m.done).length;
    const phAccId   = `sacc_${phase.replace(/[^a-z0-9]/gi,"")}`;
    const phOpen    = doneCnt > 0;

    const matchAccordions = pMatches.map(m => {
      const mAccId     = `smatch_${m.id}`;
      const matchPicks = DB.picks.filter(p => p.match_id === m.id && p.ot);
      const total      = matchPicks.length;
      const locked     = isLocked(m);

      // Conteo por resultado derivado del marcador
      const cntHome = matchPicks.filter(p => { const ph=parseInt(p.home_score),pa=parseInt(p.away_score); return !isNaN(ph)&&!isNaN(pa)&&ph>pa; }).length;
      const cntDraw = matchPicks.filter(p => { const ph=parseInt(p.home_score),pa=parseInt(p.away_score); return !isNaN(ph)&&!isNaN(pa)&&ph===pa; }).length;
      const cntAway = matchPicks.filter(p => { const ph=parseInt(p.home_score),pa=parseInt(p.away_score); return !isNaN(ph)&&!isNaN(pa)&&ph<pa; }).length;
      const pct = n => total > 0 ? Math.round(n/total*100) : 0;

      // Resultado / estado
      const resultStr = m.done && m.result
        ? `${m.result.homeScore} – ${m.result.awayScore}`
        : locked ? "EN JUEGO" : "PRÓXIMO";
      const resultPending = !m.done;

      // Marcador más popular (solo si cerrado)
      let popularScore = "";
      if (locked && total > 0) {
        const scoreMap = {};
        matchPicks.forEach(p => {
          if (p.home_score!==null && p.away_score!==null) {
            const key = `${p.home_score}-${p.away_score}`;
            scoreMap[key] = (scoreMap[key]||0) + 1;
          }
        });
        const topScore = Object.entries(scoreMap).sort((a,b)=>b[1]-a[1])[0];
        if (topScore && topScore[1] > 1)
          popularScore = `<span class="popular-score-badge">🎯 Más apostado: ${topScore[0].replace("-"," – ")} (${topScore[1]})</span>`;
      }

      // Chips de distribución visible en el header
      const distChips = total > 0
        ? `<span class="stats-cnt-chip cnt-home">🏠 ${pct(cntHome)}%</span>
           <span class="stats-cnt-chip cnt-draw">🤝 ${pct(cntDraw)}%</span>
           <span class="stats-cnt-chip cnt-away">✈️ ${pct(cntAway)}%</span>
           <span class="stats-cnt-chip cnt-none">${total} picks</span>
           ${popularScore}`
        : `<span class="stats-cnt-chip cnt-none">Sin picks</span>`;

      // Barras de distribución (en el body)
      const bars = total > 0 ? `
        <div class="stats-bars" style="margin-bottom:10px">
          <div class="stats-bar-block">
            <div class="stats-bar-label">${m.homeFlag} LOCAL</div>
            <div class="stats-bar-track"><div class="stats-bar-fill fill-home" style="width:${pct(cntHome)}%"></div></div>
            <div class="stats-bar-pct fill-home-txt">${cntHome} · ${pct(cntHome)}%</div>
          </div>
          <div class="stats-bar-block">
            <div class="stats-bar-label">EMPATE</div>
            <div class="stats-bar-track"><div class="stats-bar-fill fill-draw" style="width:${pct(cntDraw)}%"></div></div>
            <div class="stats-bar-pct fill-draw-txt">${cntDraw} · ${pct(cntDraw)}%</div>
          </div>
          <div class="stats-bar-block">
            <div class="stats-bar-label">${m.awayFlag} VISITA</div>
            <div class="stats-bar-track"><div class="stats-bar-fill fill-away" style="width:${pct(cntAway)}%"></div></div>
            <div class="stats-bar-pct fill-away-txt">${cntAway} · ${pct(cntAway)}%</div>
          </div>
        </div>` : `<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Sin pronósticos registrados</div>`;

      // Tabla de picks individuales
      let picksRows = "";
      if (locked) {
        // Ordenar: primero los que acertaron (si hay resultado), luego los demás
        const sorted = [...DB.users].sort((a, b) => {
          if (!m.done) return 0;
          const pa = calcPickPts(DB.picks.find(p=>p.user_id===a.id&&p.match_id===m.id), m).total;
          const pb = calcPickPts(DB.picks.find(p=>p.user_id===b.id&&p.match_id===m.id), m).total;
          return pb - pa;
        });
        picksRows = sorted.map(u => {
          const pick = DB.picks.find(p => p.user_id === u.id && p.match_id === m.id);
          const pts  = m.done ? calcPickPts(pick, m).total : null;
          if (!pick?.ot) return `
            <span class="stats-pick-name" style="color:var(--muted)">${u.name}</span>
            <span class="stats-pick-ot" style="color:var(--muted)">–</span>
            <span class="stats-pick-sc">–</span>
            <span class="stats-pick-pts zero">–</span>`;
          const ph=parseInt(pick.home_score), pa_=parseInt(pick.away_score);
          const pickOT  = isNaN(ph)||isNaN(pa_) ? pick.ot : ph>pa_?"1":ph===pa_?"X":"2";
          const otLabel = {"1":"LOCAL","X":"EMPATE","2":"VISITA"}[pickOT] || pickOT;
          const otColor = {"1":"var(--blue)","X":"var(--gold)","2":"var(--danger)"}[pickOT] || "var(--muted)";
          const sc      = pick.home_score!==null ? `${pick.home_score} – ${pick.away_score}` : "–";
          const adv     = pickOT==="X" && pick.advance
            ? `<span style="color:var(--gold);font-size:9px"> → ${pick.advance==="home"?m.homeFlag:m.awayFlag}</span>` : "";
          const ptsStr  = pts!==null ? pts : "?";
          const ptsZero = pts===0;
          return `
            <span class="stats-pick-name">${u.name}</span>
            <span class="stats-pick-ot" style="color:${otColor};font-size:10px">${otLabel}${adv}</span>
            <span class="stats-pick-sc">${sc}</span>
            <span class="stats-pick-pts ${ptsZero?"zero":""}">${ptsStr}</span>`;
        }).join("");
      }

      const picksTable = locked
        ? `<div class="stats-picks-table">
            <span class="stats-pick-name" style="font-size:9px;color:var(--muted);font-weight:700">JUGADOR</span>
            <span class="stats-pick-ot"   style="font-size:9px;color:var(--muted);font-weight:700;text-align:center">RESULTADO</span>
            <span class="stats-pick-sc"   style="font-size:9px;color:var(--muted);font-weight:700;text-align:center">MARCADOR</span>
            <span class="stats-pick-pts"  style="font-size:9px;color:var(--muted);font-weight:700;text-align:right">PTS</span>
            ${picksRows}
           </div>`
        : `<div style="font-size:10px;color:var(--muted);text-align:center;padding:4px 0">
             🔓 Los picks se revelan cuando cierra el partido
           </div>`;

      // Acordeón por partido: header siempre visible, body desplegable
      return `
        <div class="stats-match-acc">
          <div class="stats-match-acc-header" onclick="toggleMatchStatsAcc('${mAccId}')">
            <div class="stats-match-top">
              <div>
                <div class="stats-match-teams">${m.homeFlag} ${m.home} <span style="color:var(--gray-3)">vs</span> ${m.away} ${m.awayFlag}</div>
                <div class="stats-match-meta">${m.day} · ${fmtTime(m.timeISO)}</div>
              </div>
              <div class="stats-match-right">
                <span class="stats-match-scorebox ${resultPending?"pending":""}">${resultStr}</span>
                <span class="stats-match-acc-arrow" id="marr_${mAccId}">▼</span>
              </div>
            </div>
            <div class="stats-match-chips">${distChips}</div>
          </div>
          <div class="stats-match-acc-body" id="${mAccId}">
            ${bars}
            ${picksTable}
          </div>
        </div>`;
    }).join("");

    return `
      <div class="stats-accordion">
        <div class="stats-acc-header" onclick="toggleStatsAccordion('${phAccId}')">
          <div>
            <span class="stats-acc-phase">${phase}</span>
            <span class="stats-acc-meta" style="margin-left:8px">${doneCnt}/${pMatches.length} jugados</span>
          </div>
          <span class="stats-acc-arrow ${phOpen?"open":""}" id="sarr_${phAccId}">▼</span>
        </div>
        <div class="stats-acc-body ${phOpen?"open":""}" id="${phAccId}">
          ${matchAccordions}
        </div>
      </div>`;
  }).join("");

  document.getElementById("statsPanel").innerHTML = `
    <div class="stats-global-grid">
      <div class="stats-global-card"><div class="stats-global-val">${totalUsers}</div><div class="stats-global-lbl">PARTICIPANTES</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${totalPicks}</div><div class="stats-global-lbl">PICKS TOTALES</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${playedCount}</div><div class="stats-global-lbl">PARTIDOS JUGADOS</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${avgPts}</div><div class="stats-global-lbl">PROM. PTS GRUPO</div></div>
    </div>
    <div class="stats-champ-section">
      <div class="section-label">CAMPEÓN MÁS APOSTADO</div>
      <div class="stats-champ-grid">${champGrid}</div>
    </div>
    <div class="section-label">PICKS POR PARTIDO</div>
    ${phaseAccordions}`;
}

function bootApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display    = "block";
  document.getElementById("headerUsername").textContent = currentUser.name;
  if (currentUser.is_admin) {
    document.getElementById("tab-admin").style.display  = "block";
    document.getElementById("bnav-admin").style.display = "flex";
  }
  renderChampion();
  renderMatches();
  renderRanking();
  if (currentUser.is_admin) renderAdmin();
  // Refresco automático cada 60 s
  setInterval(async () => {
    try {
      await loadAll();
      renderMatches();
      renderRanking();
      if (currentUser.is_admin) renderAdmin();
      if (document.getElementById("screen-stats")?.classList.contains("active")) renderStats();
    } catch(e) { console.error("Refresco automático falló:", e); }
  }, 60000);
  startCountdownTick();
}

  ["picks","ranking","stats","admin"].forEach(t => {
    document.getElementById(`screen-${t}`)?.classList.remove("active");
    document.getElementById(`tab-${t}`)?.classList.remove("active");

   CAMPEÓN
═══════════════════════════════════════════════════════════════ */
function champLocked() { return DB.matches.some(m => isStarted(m)); }

function renderChampion() {
  const locked   = champLocked();
  const selected = currentUser.champion;
  document.getElementById("champSubtitle").textContent = locked
    ? "⚠️ La fase comenzó. Tu elección de campeón está bloqueada."
    : "Elige tu campeón antes del inicio del torneo (vale 5 pts).";
  document.getElementById("champGrid").innerHTML = CHAMPION_TEAMS.map(t => `
    <button class="champ-btn ${selected===t.id?"selected":""} ${locked && selected!==t.id?"locked-champ":""}"
      onclick="${locked ? "" : `selectChampion('${t.id}')`}">
      <span class="champ-flag">${t.id}</span>
      <span class="champ-name">${t.name}</span>
    </button>`).join("");
  const btn     = document.getElementById("saveChampBtn");
  const selTeam = CHAMPION_TEAMS.find(t => t.id === selected);
  btn.disabled  = locked || !selected;
  btn.textContent = locked
    ? `BLOQUEADO: ${selTeam ? selTeam.id + " " + selTeam.name : "Sin elegir"}`
    : "GUARDAR MI CAMPEÓN";
}

async function selectChampion(teamId) {
  if (champLocked()) { showToast("Ya no puedes cambiar el campeón", "error"); return; }
  currentUser.champion = currentUser.champion === teamId ? null : teamId;
  // Actualiza en la copia local de usuarios también
  const u = DB.users.find(u => u.id === currentUser.id);
  if (u) u.champion = currentUser.champion;
  try {
    await supabase.patch("users", `?id=eq.${currentUser.id}`, { champion: currentUser.champion });
  } catch(e) { showToast("Error al guardar", "error"); console.error(e); }
  renderChampion();
}

async function saveChampion() {
  if (!currentUser.champion) { showToast("Elige un equipo primero", "error"); return; }
  const t = CHAMPION_TEAMS.find(t => t.id === currentUser.champion);
  showToast(`✅ Campeón guardado: ${t.id} ${t.name}`, "success");
}

/* ═══════════════════════════════════════════════════════════════
   PARTIDOS
═══════════════════════════════════════════════════════════════ */
function renderMatches() {
  const phaseOrder = ["16vos","8vos","Cuartos","Semis","Final","General"];
  const phases = [...new Set(DB.matches.map(m => m.phase || "General"))];
  phases.sort((a,b) => phaseOrder.indexOf(a) - phaseOrder.indexOf(b));

  const accordions = phases.map(phase => {
    const phaseMatches = DB.matches.filter(m => (m.phase || "General") === phase);

    // Chips de estado
    const openCount    = phaseMatches.filter(m => !isLocked(m) && !m.done).length;
    const doneCount    = phaseMatches.filter(m => m.done).length;
    const pickedCount  = phaseMatches.filter(m => {
      const pick = DB.picks.find(p => p.user_id === currentUser.id && p.match_id === m.id);
      return !!pick?.ot;
    }).length;
    const missingOpen  = phaseMatches.filter(m => {
      const open = !isLocked(m) && !m.done;
      const pick = DB.picks.find(p => p.user_id === currentUser.id && p.match_id === m.id);
      return open && !pick?.ot;
    }).length;

    const chips = [];
    if (openCount > 0)
      chips.push(`<span class="picks-acc-chip chip-open">🔓 ${openCount} abierto${openCount>1?"s":""}</span>`);
    if (doneCount > 0 && doneCount < phaseMatches.length)
      chips.push(`<span class="picks-acc-chip chip-done">✓ ${doneCount} finalizado${doneCount>1?"s":""}</span>`);
    if (doneCount === phaseMatches.length)
      chips.push(`<span class="picks-acc-chip chip-done">✓ Fase completa</span>`);
    if (pickedCount > 0)
      chips.push(`<span class="picks-acc-chip chip-picks">🎯 ${pickedCount}/${phaseMatches.length} picks</span>`);
    if (missingOpen > 0)
      chips.push(`<span class="picks-acc-chip chip-missing">⚠️ ${missingOpen} pendiente${missingOpen>1?"s":""}</span>`);

    // Agrupar por día dentro de la fase
    const days = {};
    phaseMatches.forEach(m => { if (!days[m.day]) days[m.day] = []; days[m.day].push(m); });
    const dayGroups = Object.entries(days).map(([day, matches]) => `
      <div class="day-group">
        <div class="day-header"><span class="day-label">${day}</span><div class="day-line"></div></div>
        ${matches.map(m => renderMatchCard(m)).join("")}
      </div>`).join("");

    // Expandir por defecto si hay partidos abiertos o sin pick
    const accId   = `pacc_${phase.replace(/[^a-z0-9]/gi,"")}`;
    const startOpen = openCount > 0 || missingOpen > 0;

    return `
      <div class="picks-accordion">
        <div class="picks-acc-header" onclick="togglePicksAccordion('${accId}')">
          <div class="picks-acc-left">
            <span class="picks-acc-phase">${phase}</span>
            <div class="picks-acc-chips">${chips.join("")}</div>
          </div>
          <span class="picks-acc-arrow ${startOpen?"open":""}" id="parr_${accId}">▼</span>
        </div>
        <div class="picks-acc-body ${startOpen?"open":""}" id="${accId}">
          ${dayGroups}
        </div>
      </div>`;
  }).join("");

  document.getElementById("matchesByDay").innerHTML = accordions;
}

function togglePicksAccordion(id) {
  const body  = document.getElementById(id);
  const arrow = document.getElementById(`parr_${id}`);
  if (!body) return;
