/* ═══════════════════════════════════════════════════════════════
   GOLEADOR DEL TORNEO
═══════════════════════════════════════════════════════════════ */
function scorerLocked() {
  // Se bloquea 5 minutos antes del primer partido de Cuartos de Final
  if (!DB.matches?.length) return false;
  const cuartos = DB.matches
    .filter(m => (m.phase || "") === "Cuartos")
    .sort((a, b) => new Date(a.timeISO) - new Date(b.timeISO));
  if (cuartos.length > 0) {
    const firstCuartos = cuartos[0];
    const diffMin = (new Date(firstCuartos.timeISO) - new Date()) / 60000;
    return diffMin <= 5;
  }
  // Si aún no hay partidos de Cuartos cargados, no bloquear
  return false;
}

function renderScorer() {
  const locked   = scorerLocked();
  const selected = currentUser?.scorer || null;
  const sp = SCORER_PLAYERS.find(p => p.id === selected);

  const cuartosMatches = DB.matches
    .filter(m => (m.phase||"") === "Cuartos")
    .sort((a,b) => new Date(a.timeISO) - new Date(b.timeISO));
  const cuartosStart = cuartosMatches.length > 0
    ? cuartosMatches[0].day + " " + fmtTime(cuartosMatches[0].timeISO)
    : "inicio de Cuartos";
  document.getElementById("scorerSubtitle").textContent = locked
    ? "⚠️ La apuesta de goleador está cerrada."
    : `¿Quién será el máximo goleador? Vale 5 pts. Cierra 5 min antes de Cuartos (${cuartosStart}).`;

  document.getElementById("scorerGrid").innerHTML = SCORER_PLAYERS.map(p => `
    <button class="scorer-btn ${selected===p.id?"selected":""} ${locked&&selected!==p.id?"locked-scorer":""}"
      onclick="${locked?"":` selectScorer('${p.id}')`}">
      <div class="scorer-avatar">${p.initials}</div>
      <div class="scorer-info">
        <div class="scorer-name">${p.name}</div>
        <div class="scorer-team">${p.team}</div>
      </div>
    </button>`).join("");

  const btn = document.getElementById("saveScorerBtn");
  btn.disabled = locked || !selected;
  btn.textContent = locked
    ? `BLOQUEADO: ${sp ? sp.name : "Sin elegir"}`
    : "GUARDAR MI GOLEADOR";
}

async function selectScorer(playerId) {
  if (scorerLocked()) { showToast("Ya no puedes cambiar el goleador","error"); return; }
  currentUser.scorer = currentUser.scorer === playerId ? null : playerId;
  const u = DB.users.find(u => u.id === currentUser.id);
  if (u) u.scorer = currentUser.scorer;

  const sp = SCORER_PLAYERS.find(p=>p.id===currentUser.scorer);
  let saved = false;

  // Intento 1: columna scorer en users
  try {
    await supabase.patch("users", `?id=eq.${currentUser.id}`, { scorer: currentUser.scorer });
    saved = true;
  } catch(e) { /* columna no existe, continuar */ }

  // Intento 2: settings como respaldo
  if (!saved) {
    try {
      await supabase.upsert("settings", { key: `scorer_pick_${currentUser.id}`, value: currentUser.scorer });
      saved = true;
    } catch(e) { /* también falló */ }
  }

  // Intento 3: picks con match_id especial "scorer_pick" como último recurso
  if (!saved) {
    try {
      await supabase.upsert("picks", {
        user_id: currentUser.id,
        match_id: "scorer_pick",
        ot: currentUser.scorer || "",
        home_score: null, away_score: null
      });
      saved = true;
    } catch(e) { console.error("selectScorer todos los intentos fallaron:", e); }
  }

  if (saved) {
    showToast(sp ? `✅ ${sp.name} guardado` : "Selección eliminada", "success");
  } else {
    showToast("Error al guardar. Verifica la conexión.", "error");
  }
  renderScorer();
}

async function saveScorer() {
  if (!currentUser.scorer) { showToast("Elige un goleador primero","error"); return; }
  const sp = SCORER_PLAYERS.find(p => p.id === currentUser.scorer);
  showToast(`✅ Goleador guardado: ${sp.name}`,"success");
}

/* ── PARTIDOS ────────────────────────────────────────────────────────────── */
function renderMatches(){
  const phaseOrder=PHASE_ORDER;
  const phases=[...new Set(DB.matches.map(m=>m.phase||"General"))];
  phases.sort((a,b)=>phaseOrder.indexOf(a)-phaseOrder.indexOf(b));
  const accordions=phases.map(phase=>{
    const pMatches=DB.matches.filter(m=>(m.phase||"General")===phase);
    const openCnt=pMatches.filter(m=>!isLocked(m)&&!m.done).length;
    const doneCnt=pMatches.filter(m=>m.done).length;
    const pickedCnt=pMatches.filter(m=>{
      const pick=DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===m.id);
      return!!pick?.ot;
    }).length;
    const missingOpen=pMatches.filter(m=>{
      const open=!isLocked(m)&&!m.done;
      const pick=DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===m.id);
      return open&&!pick?.ot;
    }).length;
    const chips=[];
    if(openCnt>0)chips.push(`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(76,175,135,.18);color:var(--success)">🔓 ${openCnt} abierto${openCnt>1?"s":""}</span>`);
    if(doneCnt===pMatches.length)chips.push(`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(160,160,180,.13);color:var(--muted)">✓ Completa</span>`);
    if(pickedCnt>0)chips.push(`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(244,196,48,.15);color:var(--gold)">🎯 ${pickedCnt}/${pMatches.length}</span>`);
    if(missingOpen>0)chips.push(`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(224,82,82,.15);color:var(--danger)">⚠️ ${missingOpen} pendiente${missingOpen>1?"s":""}</span>`);
    const days={};
    pMatches.forEach(m=>{if(!days[m.day])days[m.day]=[];days[m.day].push(m);});
    const dayGroups=Object.entries(days).map(([day,matches])=>`
      <div class="day-group">
        <div class="day-header"><span class="day-label">${day}</span><div class="day-line"></div></div>
        ${matches.map(m=>renderMatchCard(m)).join("")}
      </div>`).join("");
    const accId=`pacc_${phase.replace(/[^a-z0-9]/gi,"")}`;
    const startOpen=openCnt>0||missingOpen>0;
    return `
      <div style="margin-bottom:10px;border-radius:var(--r);overflow:hidden;border:1px solid var(--gray-2)">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--gray-2);cursor:pointer;user-select:none;gap:10px" onclick="togglePicksAcc('${accId}')">
          <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
            <span style="font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:16px;letter-spacing:1.5px;color:var(--gold);white-space:nowrap">${phase}</span>
            <div style="display:flex;gap:5px;flex-wrap:wrap">${chips.join("")}</div>
          </div>
          <span style="font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block" id="parr_${accId}">▼</span>
        </div>
        <div style="display:${startOpen?"block":"none"};padding:10px 10px 4px;background:var(--green-deep)" id="${accId}">
          ${dayGroups}
        </div>
      </div>`;
  }).join("");
  document.getElementById("matchesByDay").innerHTML=accordions;
}
function togglePicksAcc(id){
  const body=document.getElementById(id);
  const arrow=document.getElementById(`parr_${id}`);
  if(!body)return;
  const open=body.style.display!=="none";
  body.style.display=open?"none":"block";
  if(arrow)arrow.style.transform=open?"":"rotate(180deg)";
}

function renderMatchCard(match){
  const pick=DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===match.id);
  const status=getStatus(match),locked=isLocked(match),saved=!!pick?.ot;
  let predArea="";
  if(locked){
    let badgeHtml="";
    if(pick?.ot){
      const ph=parseInt(pick.home_score), pa=parseInt(pick.away_score);
      const hasScore=!isNaN(ph)&&!isNaN(pa);
      const pickOT=hasScore?(ph>pa?"1":ph===pa?"X":"2"):pick.ot;
      const otClass={"1":"ot-1","X":"ot-x","2":"ot-2"}[pickOT]||"";
      // Mostrar nombre del equipo en lugar de LOCAL/VISITA
      const otLabel = pickOT==="1"
        ? `${match.homeFlag} ${match.home}`
        : pickOT==="X"
          ? "Empate"
          : `${match.awayFlag} ${match.away}`;
      const scoreStr=hasScore?`${pick.home_score} – ${pick.away_score}`:"Sin marcador";
      // Clasificado en empate: mostrar nombre del equipo que avanza
      const advTeam = pick.advance==="home"
        ? `${match.homeFlag} ${match.home}`
        : `${match.awayFlag} ${match.away}`;
      const advStr=pickOT==="X"&&pick.advance ? ` → clasifica ${advTeam}` : "";
      badgeHtml=`<div class="my-pick-badge">
        <span class="pick-tag ${otClass}">${otLabel}</span>
        <span class="pick-tag score">${scoreStr}</span>
        ${advStr?`<span class="pick-tag" style="color:var(--gold)">${advStr}</span>`:""}
      </div>`;
    }
    predArea=`<div class="locked-msg"><span class="lock-icon">🔒</span>${match.done?"Partido finalizado":"Pronósticos cerrados"}</div>${badgeHtml}`;
  } else {
    // Derivar OT actual del marcador guardado
    const ph=parseInt(pick?.home_score), pa=parseInt(pick?.away_score);
    const hasScore = !isNaN(ph) && !isNaN(pa);
    const derivedOT = hasScore ? (ph>pa?"1":ph===pa?"X":"2") : null;
    const adv = pick?.advance || null;

    // Badge resultado derivado
    const otBadge = derivedOT
      ? `<div class="pick-derived-ot ${derivedOT==="1"?"home":derivedOT==="X"?"draw":"away"}">
           ${derivedOT==="1"
             ? `${match.homeFlag} ${match.home} gana y clasifica`
             : derivedOT==="X"
               ? `🤝 Empate — ¿quién clasifica?`
               : `${match.awayFlag} ${match.away} gana y clasifica`}
         </div>`
      : `<div class="pick-derived-ot">Ingresa el marcador para continuar</div>`;

    // Selector de clasificado (solo si empate)
    const advRow = derivedOT==="X"
      ? `<div class="pick-advance-row">
           <span class="pick-advance-label">CLASIFICA →</span>
           <button class="pick-advance-btn ${adv==="home"?"sel":""}"
             onclick="setAdvance('${match.id}','home')">${match.homeFlag} ${match.home}</button>
           <button class="pick-advance-btn ${adv==="away"?"sel":""}"
             onclick="setAdvance('${match.id}','away')">${match.awayFlag} ${match.away}</button>
         </div>`
      : "";

    // El botón guardar se habilita solo cuando el pick está completo
    const canSave = derivedOT && (derivedOT!=="X" || adv);
    const ptsHint = canSave
      ? `<div class="points-hint">Máximo posible: <b>5 pts</b></div>`
      : "";

    predArea=`<div class="prediction-area">
      <div class="score-row" style="margin-bottom:7px">
        <span class="score-label">MARCADOR</span>
        <div class="score-inputs">
          <input class="score-input" type="number" min="0" max="20" id="hs_${match.id}"
            value="${pick?.home_score??""}" placeholder="–"
            oninput="onScoreInput('${match.id}')"/>
          <span class="score-sep">:</span>
          <input class="score-input" type="number" min="0" max="20" id="as_${match.id}"
            value="${pick?.away_score??""}" placeholder="–"
            oninput="onScoreInput('${match.id}')"/>
        </div>
      </div>
      <div id="ot_derived_${match.id}">${otBadge}</div>
      <div id="adv_row_${match.id}">${advRow}</div>
      <div class="score-row">
        <button class="save-btn" style="width:100%" id="savebtn_${match.id}"
          onclick="savePick('${match.id}')"
          ${canSave?"":"disabled"}>GUARDAR</button>
      </div>${ptsHint}</div>`;
  }
  return `<div class="match-card ${saved&&!locked?"saved":""} ${locked?"locked":""}" id="card_${match.id}">
    <div class="match-card-header"><span class="match-time">🕐 ${fmtTime(match.timeISO)}</span><span class="match-status ${status.cls}">${status.label}</span></div>
    <div class="match-teams">
      <div class="team"><span class="team-flag">${match.homeFlag}</span><span class="team-name">${match.home}</span></div>
      <div class="vs-block">${match.done&&match.result?`<span class="result-score">${match.result.homeScore} – ${match.result.awayScore}</span>`:`<span class="vs-text">VS</span>`}</div>
      <div class="team"><span class="team-flag">${match.awayFlag}</span><span class="team-name">${match.away}</span></div>
    </div>${predArea}</div>`;
}

let autoSaveTimers={};

/* setPick: mantenida para compatibilidad con admin modal (edición de picks) */

  let pick=DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===matchId);

}

/* setAdvance: registra quién clasifica en caso de empate */
function setAdvance(matchId, value) {
  const match = DB.matches.find(m=>m.id===matchId);
  if (!match || isLocked(match)) return;
  let pick = DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===matchId);
  if (!pick) { pick={user_id:currentUser.id,match_id:matchId,ot:null,home_score:null,away_score:null,advance:null}; DB.picks.push(pick); }
  pick.advance = pick.advance===value ? null : value;

  // Re-renderizar el selector con el nuevo estado
  const advEl = document.getElementById(`adv_row_${matchId}`);
  if (advEl) {
    advEl.innerHTML = `<div class="pick-advance-row">
      <span class="pick-advance-label">CLASIFICA →</span>
      <button class="pick-advance-btn ${pick.advance==="home"?"sel":""}"
        onclick="setAdvance('${matchId}','home')">${match.homeFlag} ${match.home}</button>
      <button class="pick-advance-btn ${pick.advance==="away"?"sel":""}"
        onclick="setAdvance('${matchId}','away')">${match.awayFlag} ${match.away}</button>
    </div>`;
  }

  // Habilitar/deshabilitar guardar
  const ph = parseInt(document.getElementById(`hs_${matchId}`)?.value);
  const pa = parseInt(document.getElementById(`as_${matchId}`)?.value);
  const hasScore = !isNaN(ph) && !isNaN(pa);
  const derivedOT = hasScore ? (ph>pa?"1":ph===pa?"X":"2") : null;
  const canSave = derivedOT==="X" && !!pick.advance;
  const btn = document.getElementById(`savebtn_${matchId}`);
  if (btn) btn.disabled = !canSave;

  if (canSave) {
    clearTimeout(autoSaveTimers[matchId]);
    autoSaveTimers[matchId] = setTimeout(() => savePick(matchId, true), 1500);
  }
}

async function savePick(matchId,silent=false){
  const match=DB.matches.find(m=>m.id===matchId);
  if(isLocked(match)){if(!silent)showToast("Este partido ya está cerrado 🔒","error");return;}

  const hsVal = document.getElementById(`hs_${matchId}`)?.value;
  const asVal = document.getElementById(`as_${matchId}`)?.value;
  const ph = parseInt(hsVal), pa = parseInt(asVal);
  const hasScore = !isNaN(ph) && !isNaN(pa);

  if (!hasScore) {
    if (!silent) showToast("Ingresa el marcador primero","error");
    return;
  }

  // OT siempre derivado del marcador
  const derivedOT = ph>pa?"1":ph===pa?"X":"2";

  // Recuperar pick y advance del cache
  let pick = DB.picks.find(p=>p.user_id===currentUser.id&&p.match_id===matchId);
  const advance = derivedOT==="X" ? (pick?.advance||null) : null;

  if (derivedOT==="X" && !advance) {
    if (!silent) showToast(`Empate: elige quién clasifica (${match.home} o ${match.away})`,"error");
    return;
  }

  if (!pick) {
    pick = {user_id:currentUser.id,match_id:matchId,ot:derivedOT,home_score:hsVal,away_score:asVal,advance};
    DB.picks.push(pick);
  } else {
    pick.ot=derivedOT; pick.home_score=hsVal; pick.away_score=asVal; pick.advance=advance;
  }

  try{
    await supabase.upsert("picks",{
      user_id:currentUser.id, match_id:matchId,
      ot:derivedOT, home_score:parseInt(hsVal), away_score:parseInt(asVal), advance
    });
    if(!silent)showToast("✅ Pronóstico guardado","success");
    const card=document.getElementById(`card_${matchId}`);
    if(card){
      card.classList.add("saved");
      card.classList.add("flash-save");
      setTimeout(()=>card.classList.remove("flash-save"),700);
    }
  }catch(e){if(!silent)showToast("Error al guardar","error");console.error(e);}
}


/* ── GRÁFICO SVG DE EVOLUCIÓN DE PUNTOS ─────────────────────────────────── */
function generateEvoChart(user) {
  // Partidos finalizados en orden cronológico
  const played = DB.matches
    .filter(m => m.done && m.result)
    .sort((a,b) => new Date(a.timeISO) - new Date(b.timeISO));
  if (played.length === 0) return "";

  // Calcular puntos acumulados partido a partido
  let cumPts = 0;
  const data = played.map(m => {
    const pick = DB.picks.find(p => p.user_id === user.id && p.match_id === m.id);
    cumPts += calcPickPts(pick, m).total;
    return { m, pts: cumPts };
  });

  // Agregar campeón al final si aplica
  const champPts = DB.championWinner && user.champion === DB.championWinner ? 5 : 0;
  if (champPts > 0) {
    data[data.length - 1] = { ...data[data.length - 1], pts: data[data.length - 1].pts + champPts };
  }

  const W = 280, H = 80, PAD = { t:10, r:10, b:20, l:28 };
  const chartW = W - PAD.l - PAD.r;
  const chartH = H - PAD.t - PAD.b;

  const maxPts = Math.max(...data.map(d => d.pts), 1);
  const xStep = data.length > 1 ? chartW / (data.length - 1) : chartW;

  const toX = i => PAD.l + (data.length > 1 ? i * xStep : chartW / 2);
  const toY = v => PAD.t + chartH - (v / maxPts) * chartH;

  // Línea
  const points = data.map((d,i) => `${toX(i).toFixed(1)},${toY(d.pts).toFixed(1)}`).join(" ");
  // Área bajo la curva
  const areaPoints = [
    `${toX(0).toFixed(1)},${(PAD.t+chartH).toFixed(1)}`,
    ...data.map((d,i) => `${toX(i).toFixed(1)},${toY(d.pts).toFixed(1)}`),
    `${toX(data.length-1).toFixed(1)},${(PAD.t+chartH).toFixed(1)}`
  ].join(" ");

  // Etiquetas eje Y
  const yLabels = [0, Math.round(maxPts/2), maxPts].map(v => `
    <text x="${PAD.l - 4}" y="${toY(v) + 3}" text-anchor="end" font-size="8" fill="#8888aa">${v}</text>
    <line x1="${PAD.l}" y1="${toY(v)}" x2="${W - PAD.r}" y2="${toY(v)}" stroke="#2a2a3e" stroke-width="1" stroke-dasharray="3,3"/>`
  ).join("");

  // Puntos en la línea y etiquetas
  const dots = data.map((d,i) => {
    const x = toX(i).toFixed(1), y = toY(d.pts).toFixed(1);
    const isLast = i === data.length - 1;
    const labelX = i === 0 ? PAD.l : i === data.length - 1 ? toX(i) - 2 : toX(i);
    const anchor  = i === 0 ? "start" : i === data.length - 1 ? "end" : "middle";
    const showLabel = i === 0 || isLast || (data.length <= 8);
    return `
      <circle cx="${x}" cy="${y}" r="3" fill="#f4c430" stroke="#0a1628" stroke-width="1.5"/>
      ${showLabel ? `<text x="${labelX}" y="${parseFloat(y)-6}" text-anchor="${anchor}" font-size="8" fill="#f4c430" font-weight="bold">${d.pts}</text>` : ""}`;
  }).join("");

  // Eje X: etiquetas de partido abreviado
  const xLabels = data.map((d,i) => {
    if(data.length > 8 && i % 2 !== 0 && i !== data.length - 1) return "";
    const label = d.m.homeFlag + d.m.awayFlag;
    return `<text x="${toX(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="7" fill="#8888aa">${label}</text>`;
  }).join("");

  return `
    <div class="evo-chart-wrap">
      <div class="evo-chart-title">EVOLUCIÓN DE PUNTOS</div>
      <svg class="evo-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <!-- Grid y etiquetas Y -->
        ${yLabels}
        <!-- Área -->
        <polygon points="${areaPoints}" fill="rgba(244,196,48,0.07)"/>
        <!-- Línea -->
        <polyline points="${points}" fill="none" stroke="#f4c430" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Puntos -->
        ${dots}
        <!-- Etiquetas X -->
        ${xLabels}
      </svg>
    </div>`;
}

/* ── RANKING ─────────────────────────────────────────────────────────────── */
function renderRanking(){
  const ranking=calcRanking();
  const playedCount=DB.matches.filter(m=>m.done).length;
  const myStats=ranking.find(u=>u.id===currentUser.id)||{pts:0};
  const myPos=ranking.findIndex(u=>u.id===currentUser.id)+1;
  // Distancia al vecino — tarjetas con nombre del rival
  const above = myPos > 1 ? ranking[myPos-2] : null;
  const below  = myPos < ranking.length ? ranking[myPos] : null;
  const gapUp   = above ? above.pts - myStats.pts : null;
  const gapDown = below  ? myStats.pts - below.pts  : null;

  let gapHtml = "";
  if (myPos > 0 && ranking.length > 1) {
    const cardUp = above
      ? `<div class="rank-gap-card up">
           <span class="rank-gap-arrow">📈</span>
           <span class="rank-gap-pts success">${gapUp === 0 ? "=" : "-"+gapUp+" pts"}</span>
           <span class="rank-gap-label">${gapUp === 0 ? "EMPATE CON" : "PARA SUPERAR"}</span>
           <span class="rank-gap-rival">#${myPos-1} ${above.name}</span>
         </div>`
      : `<div class="rank-gap-card alone">
           <span class="rank-gap-arrow">🏆</span>
           <span class="rank-gap-pts success">1°</span>
           <span class="rank-gap-label">LIDER DEL GRUPO</span>
         </div>`;

    const cardDown = below
      ? `<div class="rank-gap-card down">
           <span class="rank-gap-arrow">📉</span>
           <span class="rank-gap-pts muted">+${gapDown} pts</span>
           <span class="rank-gap-label">DE VENTAJA SOBRE</span>
           <span class="rank-gap-rival">#${myPos+1} ${below.name}</span>
         </div>`
      : "";

    gapHtml = above
      ? `<div class="rank-gap-wrap">${cardUp}${cardDown}</div>`
      : `<div class="rank-gap-wrap">${cardUp}</div>`;
  }

  document.getElementById("rankingSummary").innerHTML=`
    <div class="rank-stat"><div class="rank-stat-val">${myStats.pts}</div><div class="rank-stat-label">MIS PUNTOS</div></div>
    <div class="rank-stat"><div class="rank-stat-val">${myPos||"–"}</div><div class="rank-stat-label">MI POSICIÓN</div></div>
    <div class="rank-stat"><div class="rank-stat-val">${playedCount}</div><div class="rank-stat-label">JUGADOS</div></div>
    ${gapHtml}`;
  const medals=["🥇","🥈","🥉"],pCls=["p1","p2","p3"];
  const top3=ranking.slice(0,Math.min(3,ranking.length));
  document.getElementById("podiumRow").innerHTML=top3.map((u,i)=>{
    const ct=CHAMPION_TEAMS.find(t=>t.id===u.champion);
    const sp=SCORER_PLAYERS.find(p=>p.id===u.scorer);
    return `<div class="podium-card ${pCls[i]}"><span class="podium-medal">${medals[i]}</span>
      <div class="podium-name">${u.name}${u.id===currentUser.id?" 👈":""}</div>
      <div class="podium-pts">${u.pts}</div><div class="podium-pts-lbl">puntos</div>
      <div class="podium-champ">🏆 ${ct?ct.id+" "+ct.name:"Sin campeón"}</div>
      <div class="podium-champ">⚽ ${sp?sp.name:"Sin goleador"}</div></div>`;
  }).join("");
  if(!ranking.length){document.getElementById("rankingList").innerHTML=`<div class="empty"><div class="empty-icon">🏁</div>Aún no hay participantes.</div>`;return;}
  renderCompareSelector();
  document.getElementById("rankingList").innerHTML=ranking.map((u,i)=>{
    const ct=CHAMPION_TEAMS.find(t=>t.id===u.champion);
    const sp=SCORER_PLAYERS.find(p=>p.id===u.scorer);
    const isMe=u.id===currentUser.id;
    const streaks=calcStreaks(u);
    let streakBadge="";
    if(streaks.pos>=2)streakBadge=`<span class="streak-badge ${streaks.pos>=4?"fire":""}">${streaks.pos>=4?"🔥":"⚡"} ${streaks.pos} seguidos</span>`;
    else if(streaks.neg>=2)streakBadge=`<span class="streak-badge neg">💤 ${streaks.neg} sin puntuar</span>`;
    const pickRows=DB.matches.map(m=>{
      const pick=DB.picks.find(p=>p.user_id===u.id&&p.match_id===m.id);
      if(!isLocked(m)&&!m.done)return`<div class="detail-pick-row"><span class="detail-pick-match">${m.homeFlag} vs ${m.awayFlag}</span><span class="detail-pick-sel" style="color:var(--muted)">🔓</span><span class="detail-pick-score">–</span><span class="detail-pick-pts zero">–</span></div>`;
      if(!pick?.ot)return`<div class="detail-pick-row"><span class="detail-pick-match">${m.homeFlag} vs ${m.awayFlag}</span><span class="detail-pick-sel" style="color:var(--muted)">–</span><span class="detail-pick-score">–</span><span class="detail-pick-pts zero">–</span></div>`;
      const p=calcPickPts(pick,m);
      const otLabel={"1":"LOC","X":"EMP","2":"VIS"}[pick.ot];
      const otColor={"1":"var(--blue)","X":"var(--gold)","2":"var(--danger)"}[pick.ot];
      const sc=pick.home_score!==null?`${pick.home_score}-${pick.away_score}`:"–";
      return`<div class="detail-pick-row"><span class="detail-pick-match">${m.homeFlag} vs ${m.awayFlag}</span><span class="detail-pick-sel" style="color:${otColor}">${otLabel}</span><span class="detail-pick-score">${sc}</span><span class="detail-pick-pts ${p.total===0?"zero":""}">${m.done?p.total:"–"}</span></div>`;
    }).join("");
    return`
      <div class="ranking-row ${isMe?"me":""}" id="rrow_${u.id}" onclick="toggleDetail('${u.id}')">
        <div class="rank-pos ${i<3?"top":""}">${i+1}</div>
        <div class="rank-info">
          <div class="rank-name">${u.name}${isMe?" 👈":""} ${streakBadge}</div>
          <div class="rank-sub">🏆 ${ct?ct.id+" "+ct.name:"Sin campeón"} · ⚽ ${sp?sp.name:"Sin goleador"}</div>
        </div>
        <div class="rank-pts-block"><div class="rank-pts">${u.pts}</div><div class="rank-pts-lbl">pts</div></div>
      </div>
      <div class="rank-detail" id="rdetail_${u.id}">
        <div class="detail-grid">
          <div class="detail-cell"><div class="detail-val">${u.ot+u.advance}</div><div class="detail-lbl">Resultados</div></div>
          <div class="detail-cell"><div class="detail-val">${Math.floor(u.exact/3)}</div><div class="detail-lbl">Exactos</div></div>
          <div class="detail-cell"><div class="detail-val">${u.champ}</div><div class="detail-lbl">Campeón</div></div>
        </div>
        ${generateEvoChart(u)}
        ${generatePosHistory(u, ranking)}
        <div class="detail-picks-title" style="margin-top:10px">PICKS POR PARTIDO</div>${pickRows}
      </div>`;
  }).join("");
}
function toggleDetail(userId){
  const detail=document.getElementById(`rdetail_${userId}`),row=document.getElementById(`rrow_${userId}`);
  if(!detail)return;
  const isOpen=detail.classList.contains("open");
  document.querySelectorAll(".rank-detail").forEach(el=>el.classList.remove("open"));
  document.querySelectorAll(".ranking-row").forEach(el=>el.classList.remove("expanded"));
  if(!isOpen){detail.classList.add("open");row.classList.add("expanded");}
}

/* ── COMPARADOR DE JUGADORES ─────────────────────────────────────────────── */
function renderCompareSelector() {
  const sec = document.getElementById("compareSection");
  if (!sec || DB.users.length < 2) return;
  sec.style.display = "block";
  const opts = DB.users.map(u =>
    `<option value="${u.id}">${u.name}</option>`).join("");
  document.getElementById("comparePanel").innerHTML = `
    <div class="compare-select-row">
      <select class="compare-select" id="cmp_a">${opts}</select>
      <span style="color:var(--muted);font-weight:700;font-size:13px">VS</span>
      <select class="compare-select" id="cmp_b">${opts}</select>
    </div>
    <button class="compare-btn" style="width:100%;margin-bottom:12px" onclick="renderComparePlayers()">⚡ COMPARAR</button>
    <div id="compareResult"></div>`;
  // Pre-seleccionar segundo jugador diferente al primero
  const bSel = document.getElementById("cmp_b");
  if (bSel && DB.users.length > 1) bSel.value = DB.users[1].id;
}

function renderComparePlayers() {
  const idA = document.getElementById("cmp_a")?.value;
  const idB = document.getElementById("cmp_b")?.value;
  if (!idA || !idB || idA === idB) {
    document.getElementById("compareResult").innerHTML =
      `<div style="font-size:11px;color:var(--muted);text-align:center;padding:12px">Elige dos jugadores distintos</div>`;
    return;
  }
  const uA = DB.users.find(u=>u.id===idA), uB = DB.users.find(u=>u.id===idB);
  const sA = calcUserStats(uA), sB = calcUserStats(uB);
  const rankA = calcRanking().findIndex(u=>u.id===idA)+1;
  const rankB = calcRanking().findIndex(u=>u.id===idB)+1;
  const ctA   = CHAMPION_TEAMS.find(t=>t.id===uA.champion);
  const ctB   = CHAMPION_TEAMS.find(t=>t.id===uB.champion);
  const spA   = SCORER_PLAYERS.find(p=>p.id===uA.scorer);
  const spB   = SCORER_PLAYERS.find(p=>p.id===uB.scorer);

  const stat = (a, b, lblA, lbl, lblB) => `
    <div class="compare-stat-row">
      <span class="compare-val-a ${a>b?"win":""}">${lblA}</span>
      <span class="compare-lbl">${lbl}</span>
      <span class="compare-val-b ${b>a?"win":""}" style="text-align:right">${lblB}</span>
    </div>`;

  // Picks por partido
  const played = DB.matches.filter(m=>m.done&&m.result)
    .sort((a,b)=>new Date(a.timeISO)-new Date(b.timeISO));

  const matchRows = played.map(m=>{
    const pickA = DB.picks.find(p=>p.user_id===idA&&p.match_id===m.id);
    const pickB = DB.picks.find(p=>p.user_id===idB&&p.match_id===m.id);
    const pA = calcPickPts(pickA,m).total, pB = calcPickPts(pickB,m).total;
    const phA=parseInt(pickA?.home_score),paA=parseInt(pickA?.away_score);
    const phB=parseInt(pickB?.home_score),paB=parseInt(pickB?.away_score);
    const otA = pickA?.ot ? (!isNaN(phA)&&!isNaN(paA)?(phA>paA?"1":phA===paA?"X":"2"):pickA.ot) : null;
    const otB = pickB?.ot ? (!isNaN(phB)&&!isNaN(paB)?(phB>paB?"1":phB===paB?"X":"2"):pickB.ot) : null;
    const labelOT = o => o?{"1":"LOC","X":"EMP","2":"VIS"}[o]:"–";
    const colorA = pA>pB?"cmp-win":pA<pB?"cmp-lose":"cmp-tie";
    const colorB = pB>pA?"cmp-win":pB<pA?"cmp-lose":"cmp-tie";
    const scA = !isNaN(phA)?`${phA}-${paA}`:"–";
    const scB = !isNaN(phB)?`${phB}-${paB}`:"–";
    return`<div class="compare-match-row">
      <span class="cmp-pick-a ${colorA}">${labelOT(otA)} ${scA}<br><span style="font-family:'Bebas Neue',Arial,sans-serif;font-size:13px">${pA} pts</span></span>
      <span class="cmp-match-name">${m.homeFlag}<br>vs<br>${m.awayFlag}<br><span style="font-size:8px">${m.result.homeScore}–${m.result.awayScore}</span></span>
      <span class="cmp-pick-b ${colorB}">${labelOT(otB)} ${scB}<br><span style="font-family:'Bebas Neue',Arial,sans-serif;font-size:13px">${pB} pts</span></span>
    </div>`;
  }).join("");

  document.getElementById("compareResult").innerHTML = `
    <div class="compare-panel">
      <div class="compare-header">
        <span>${uA.name}</span>
        <span class="compare-header-vs">VS</span>
        <span>${uB.name}</span>
      </div>
      ${stat(sA.pts,sB.pts,sA.pts,"PUNTOS TOTALES",sB.pts)}
      ${stat(rankB,rankA,"#"+rankA,"POSICIÓN","#"+rankB)}
      ${stat(Math.floor(sA.exact/3),Math.floor(sB.exact/3),Math.floor(sA.exact/3),"EXACTOS",Math.floor(sB.exact/3))}
      ${stat(sA.ot+sA.advance,sB.ot+sB.advance,sA.ot+sA.advance,"RESULTADOS",sB.ot+sB.advance)}
      <div class="compare-stat-row">
        <span style="font-size:10px;color:var(--muted);text-align:left">${ctA?ctA.id+" "+ctA.name:"–"}</span>
        <span class="compare-lbl">CAMPEÓN</span>
        <span style="font-size:10px;color:var(--muted);text-align:right">${ctB?ctB.id+" "+ctB.name:"–"}</span>
      </div>
      <div class="compare-stat-row">
        <span style="font-size:10px;color:var(--muted);text-align:left">${spA?spA.name:"–"}</span>
        <span class="compare-lbl">GOLEADOR</span>
        <span style="font-size:10px;color:var(--muted);text-align:right">${spB?spB.name:"–"}</span>
      </div>
      ${played.length?`
        <div style="padding:6px 12px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;background:var(--gray-2);border-top:1px solid var(--gray-2)">PARTIDO A PARTIDO</div>
        ${matchRows}`:""}
    </div>
    <button class="compare-share-btn" onclick="shareCompareImage('${idA}','${idB}')">
      📸 Compartir comparativa por WhatsApp
    </button>`;
}

/* ── ESTADÍSTICAS ────────────────────────────────────────────────────────── */
function renderStats(){
  const totalPicks=DB.picks.filter(p=>p.ot).length;
  const totalUsers=DB.users.length;
  const playedCount=DB.matches.filter(m=>m.done).length;
  const avgPts=totalUsers?(DB.users.reduce((s,u)=>s+calcUserStats(u).pts,0)/totalUsers).toFixed(1):0;

  // Campeones
  const champMap={};
  DB.users.forEach(u=>{if(u.champion)champMap[u.champion]=(champMap[u.champion]||0)+1;});
  const champSorted=Object.entries(champMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const champGrid=champSorted.length===0
    ?`<div style="font-size:12px;color:var(--muted)">Nadie ha elegido campeón aún.</div>`
    :champSorted.map(([id,cnt])=>{
        const t=CHAMPION_TEAMS.find(t=>t.id===id);
        return`<div style="background:var(--gray-1);border:1px solid var(--gray-2);border-radius:var(--rs);padding:8px 6px;text-align:center">
          <div style="font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:11px;background:var(--gray-3);color:var(--white);border-radius:4px;padding:2px 5px;margin-bottom:4px;display:inline-block">${id}</div>
          <div style="font-size:8px;color:var(--muted);font-weight:600;margin-bottom:4px">${t?.name||id}</div>
          <div style="font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:20px;color:var(--gold);line-height:1">${cnt}</div>
          <div style="font-size:8px;color:var(--muted)">${cnt===1?"voto":"votos"}</div>
        </div>`;
      }).join("");

  // Ranking por fase
  const phases=[...new Set(DB.matches.map(m=>m.phase||"General"))];
  phases.sort((a,b)=>PHASE_ORDER.indexOf(a)-PHASE_ORDER.indexOf(b));

  const phaseRankingSections=phases.map(phase=>{
    const pMatches=DB.matches.filter(m=>(m.phase||"General")===phase);
    const doneCnt=pMatches.filter(m=>m.done).length;
    if(doneCnt===0)return""; // no mostrar fases sin partidos jugados

    // Calcular ranking de esa fase para cada usuario
    const phaseRanking=DB.users.map(u=>{
      const ps=calcUserPhaseStats(u,phase);
      return{...u,...ps};
    }).sort((a,b)=>b.pts-a.pts||b.exact-a.exact||b.ot-a.ot||a.name.localeCompare(b.name));

    const phaseTop3=phaseRanking.slice(0,Math.min(3,phaseRanking.length));
    const restRanking=phaseRanking.slice(3);
    const podMedals=["🥇","🥈","🥉"],podCls=["pp1","pp2","pp3"];

    const podiumHtml=phaseTop3.map((u,i)=>`
      <div class="phase-podium-card ${podCls[i]}">
        <span class="phase-podium-medal">${podMedals[i]}</span>
        <div class="phase-podium-name">${u.name}</div>
        <div class="phase-podium-pts">${u.pts}</div>
        <div class="phase-podium-lbl">pts</div>
      </div>`).join("");

    const restHtml=restRanking.map((u,i)=>`
      <div class="phase-rank-row">
        <span class="phase-rank-pos">${i+4}</span>
        <span class="phase-rank-name">${u.name}</span>
        <span class="phase-rank-pts">${u.pts}</span>
      </div>`).join("");

    const accId=`phrank_${phase.replace(/[^a-z0-9]/gi,"")}`;
    return`
      <div class="phase-rank-section">
        <div class="phase-rank-header" onclick="togglePhaseRank('${accId}')">
          <div>
            <span class="phase-rank-title">${phase}</span>
            <span class="phase-rank-meta" style="margin-left:8px">${doneCnt}/${pMatches.length} partidos jugados</span>
          </div>
          <span class="phase-rank-arrow" id="pharr_${accId}">▼</span>
        </div>
        <div class="phase-rank-body" id="${accId}">
          <div class="phase-podium">${podiumHtml}</div>
          ${restHtml?`<div class="phase-full-list">${restHtml}</div>`:""}
        </div>
      </div>`;
  }).filter(Boolean).join("");

  // Resumen de jornada
  // Goleadores apostados
  const scorerMap={};
  DB.users.forEach(u=>{if(u.scorer)scorerMap[u.scorer]=(scorerMap[u.scorer]||0)+1;});
  const maxScorerVotes=Math.max(0,...Object.values(scorerMap));
  const scorerGrid=SCORER_PLAYERS.map(p=>{
    const cnt=scorerMap[p.id]||0;
    const isLeader=cnt>0&&cnt===maxScorerVotes;
    return`<div class="scorer-stats-card">
      <div class="scorer-stats-avatar ${isLeader?"leader":""}">${p.initials}</div>
      <div class="scorer-stats-info">
        <div class="scorer-stats-name">${p.name}</div>
        <div class="scorer-stats-team">${p.team}</div>
      </div>
      <div>
        <div class="scorer-stats-cnt">${cnt}</div>
        <div class="scorer-stats-lbl">${cnt===1?"voto":"votos"}</div>
      </div>
    </div>`;
  }).join("");

  const summaryBtn=`<button class="summary-btn" onclick="copyDaySummary()">📋 Copiar resumen para WhatsApp</button>`;

  // ── PICKS POR PARTIDO (acordeón por fase → partido) ──────────────
  const matchPhases=[...new Set(DB.matches.map(m=>m.phase||"General"))];
  matchPhases.sort((a,b)=>PHASE_ORDER.indexOf(a)-PHASE_ORDER.indexOf(b));

  const matchStatsHtml=matchPhases.map(phase=>{
    const pMatches=DB.matches.filter(m=>(m.phase||"General")===phase);
    const phAccId=`msp_${phase.replace(/[^a-z0-9]/gi,"")}`;
    const doneCnt=pMatches.filter(m=>m.done).length;

    const matchAccordions=pMatches.map(m=>{
      const mAccId=`ms_${m.id}`;
      const mPicks=DB.picks.filter(p=>p.match_id===m.id&&p.ot);
      const total=mPicks.length;
      const locked=isLocked(m);

      // Conteo por resultado
      const cnt1=mPicks.filter(p=>{const ph=parseInt(p.home_score),pa=parseInt(p.away_score);return!isNaN(ph)&&!isNaN(pa)&&ph>pa;}).length;
      const cntX=mPicks.filter(p=>{const ph=parseInt(p.home_score),pa=parseInt(p.away_score);return!isNaN(ph)&&!isNaN(pa)&&ph===pa;}).length;
      const cnt2=mPicks.filter(p=>{const ph=parseInt(p.home_score),pa=parseInt(p.away_score);return!isNaN(ph)&&!isNaN(pa)&&ph<pa;}).length;
      const pct=n=>total>0?Math.round(n/total*100):0;

      // Marcador más popular (solo si partido cerrado y hay marcadores)
      let popularHtml="";
      if(locked&&total>0){
        const scoreMap={};
        mPicks.forEach(p=>{
          if(p.home_score!==null&&p.away_score!==null){
            const k=`${p.home_score}-${p.away_score}`;
            scoreMap[k]=(scoreMap[k]||0)+1;
          }

        const top=Object.entries(scoreMap).sort((a,b)=>b[1]-a[1])[0];
        if(top&&top[1]>1){
          popularHtml=`<div class="stats-popular">🎯 Marcador más apostado: <b>${top[0].replace("-"," – ")} (${top[1]} votos)</b></div>`;
        }
      }

      // Chip de marcador popular: mostrar el marcador exacto más frecuente
      let popularChip = "";
      if(locked && total > 0){
        const scoreMap={};
        mPicks.forEach(p=>{
          if(p.home_score!==null&&p.away_score!==null){
            const k=`${p.home_score}-${p.away_score}`;
            scoreMap[k]=(scoreMap[k]||0)+1;
          }
        });
        const top=Object.entries(scoreMap).sort((a,b)=>b[1]-a[1])[0];
        if(top){
          // Mostrar el marcador exacto y la cantidad de picks
          popularChip=`<span class="sdchip sdchip-pop">🎯 Más apostado: ${top[0].replace("-"," – ")} (${top[1]})</span>`;
        }
      }

      // Chips de distribución
      const chips=total>0?`
        <span class="sdchip sdchip-home">🏠 ${pct(cnt1)}%</span>
        <span class="sdchip sdchip-draw">🤝 ${pct(cntX)}%</span>
        <span class="sdchip sdchip-away">✈️ ${pct(cnt2)}%</span>
        <span class="sdchip sdchip-none">${total} pick${total!==1?"s":""}</span>
        ${popularChip}
      `:`<span class="sdchip sdchip-none">Sin picks</span>`;

      // Resultado / estado
      const resultStr=m.done&&m.result?`${m.result.homeScore} – ${m.result.awayScore}`:(locked?"EN JUEGO":"PRÓXIMO");
      const resultPending=!m.done;

      // Barras
      const barsHtml=total>0?`
        <div class="stats-bars-wrap">
          <div class="stats-bar-row">

          </div>
          <div class="stats-bar-row">
            <span class="stats-bar-lbl">EMPATE</span>
            <div class="stats-bar-track"><div class="stats-bar-fill fill-draw" style="width:${pct(cntX)}%"></div></div>
            <span class="stats-bar-val draw">${cntX} · ${pct(cntX)}%</span>
          </div>
          <div class="stats-bar-row">
            <span class="stats-bar-lbl">${m.awayFlag} VISITA</span>
            <div class="stats-bar-track"><div class="stats-bar-fill fill-away" style="width:${pct(cnt2)}%"></div></div>
            <span class="stats-bar-val away">${cnt2} · ${pct(cnt2)}%</span>
          </div>
        </div>
        `
      :`<div class="stats-locked-msg">Sin pronósticos registrados</div>`;

      // Picks individuales (solo si cerrado)
      let picksHtml="";
      if(locked){
        const sortedUsers=[...DB.users].sort((a,b)=>{
          if(!m.done)return 0;
          return calcPickPts(DB.picks.find(p=>p.user_id===b.id&&p.match_id===m.id),m).total
               - calcPickPts(DB.picks.find(p=>p.user_id===a.id&&p.match_id===m.id),m).total;
        });
        const rows=sortedUsers.map(u=>{
          const pick=DB.picks.find(p=>p.user_id===u.id&&p.match_id===m.id);
          const pts=m.done?calcPickPts(pick,m).total:null;
          if(!pick?.ot)return`<div class="stats-pick-row">
            <span class="stats-pick-name" style="color:var(--muted)">${u.name}</span>
            <span class="stats-pick-ot" style="color:var(--muted)">–</span>
            <span class="stats-pick-sc">–</span>
            <span class="stats-pick-pts zero">–</span></div>`;
          const ph=parseInt(pick.home_score),pa=parseInt(pick.away_score);
          const pickOT=isNaN(ph)||isNaN(pa)?pick.ot:ph>pa?"1":ph===pa?"X":"2";
          const otLabel=pickOT==="1"
            ? `${m.homeFlag} ${m.home}`
            : pickOT==="X"?"Empate"
            : `${m.awayFlag} ${m.away}`;
          const otColor={"1":"var(--blue)","X":"var(--gold)","2":"var(--danger)"}[pickOT]||"var(--muted)";
          const sc=pick.home_score!==null?`${pick.home_score} – ${pick.away_score}`:"–";
          const advName=pick.advance==="home"?`${m.homeFlag} ${m.home}`:`${m.awayFlag} ${m.away}`;
          const adv=pickOT==="X"&&pick.advance?` → ${advName}`:"";
          const ptsStr=pts!==null?pts:"?";
          return`<div class="stats-pick-row">
            <span class="stats-pick-name">${u.name}</span>
            <span class="stats-pick-ot" style="color:${otColor};font-size:10px">${otLabel}${adv}</span>
            <span class="stats-pick-sc">${sc}</span>
            <span class="stats-pick-pts ${pts===0?"zero":""}">${ptsStr}</span></div>`;
        }).join("");
        picksHtml=`<div class="stats-picks-table">
          <div class="stats-picks-head">
            <span>JUGADOR</span><span style="text-align:center">RESULTADO</span>
            <span style="text-align:center">MARCADOR</span><span style="text-align:right">PTS</span>
          </div>${rows}</div>`;
      } else {
        picksHtml=`<div class="stats-locked-msg">🔓 Los picks se revelan cuando cierra el partido</div>`;
      }

      return`<div class="stats-match-section">
        <div class="stats-match-header" onclick="toggleMatchStats('${mAccId}')">
          <div class="stats-match-title-block">
            <div class="stats-match-name">${m.homeFlag} ${m.home} vs ${m.away} ${m.awayFlag}</div>
            <div class="stats-match-sub">${m.day} · ${fmtTime(m.timeISO)}</div>
            <div class="stats-dist-chips">${chips}</div>
          </div>
          <div class="stats-match-right">
            <span class="stats-result-box ${resultPending?"pending":""}">${resultStr}</span>
            <span class="stats-match-arrow" id="marr_${mAccId}">▼</span>
          </div>
        </div>
        <div class="stats-match-body" id="${mAccId}">
          ${barsHtml}
          ${picksHtml}
        </div>
      </div>`;
    }).join("");

    // Acordeón de fase conteniendo los partidos
    const open=doneCnt>0;
    return`<div style="margin-bottom:10px;border:1px solid var(--gray-2);border-radius:var(--r);overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--gray-2);cursor:pointer;user-select:none" onclick="toggleMatchStatsPhase('${phAccId}')">
        <div>
          <span style="font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--gold)">${phase}</span>
          <span style="font-size:10px;color:var(--muted);margin-left:8px">${doneCnt}/${pMatches.length} jugados</span>
        </div>
        <span style="font-size:11px;color:var(--muted);transition:transform .2s;display:inline-block" id="pharr2_${phAccId}">▼</span>
      </div>
      <div style="display:${open?"block":"none"};padding:8px" id="${phAccId}">
        ${matchAccordions}
      </div>
    </div>`;
  }).join("");

  document.getElementById("statsPanel").innerHTML=`
    <div class="stats-global-grid">
      <div class="stats-global-card"><div class="stats-global-val">${totalUsers}</div><div class="stats-global-lbl">PARTICIPANTES</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${totalPicks}</div><div class="stats-global-lbl">PICKS TOTALES</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${playedCount}</div><div class="stats-global-lbl">JUGADOS</div></div>
      <div class="stats-global-card"><div class="stats-global-val">${avgPts}</div><div class="stats-global-lbl">PROM. PTS GRUPO</div></div>
    </div>
    ${summaryBtn}
    <div class="section-label">CAMPEÓN MÁS APOSTADO</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px">${champGrid}</div>

    ${phaseRankingSections||`<div class="empty"><div class="empty-icon">⏳</div>Aún no hay partidos finalizados.</div>`}
    <div class="section-label" style="margin-top:18px">PICKS POR PARTIDO</div>

}

/* ═══════════════════════════════════════════════════════════════
   AGREGAR PARTIDO DESDE ADMIN
═══════════════════════════════════════════════════════════════ */
function nmBuildDayLabel(d, m, y) {
  const DIAS  = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const MESES = ["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const date  = new Date(`${y}-${m}-${d}T12:00:00`);
  return `${DIAS[date.getDay()]} ${d} ${MESES[parseInt(m)]}`;
}

function nmBuildISO(d, m, y, hh, mm) {
  return `${y}-${m}-${d}T${hh}:${mm}:00-04:00`;
}

function nmPreview() {
  const d  = document.getElementById("nm_d")?.value;
  const m  = document.getElementById("nm_m")?.value;
  const y  = document.getElementById("nm_y")?.value;
  const hh = document.getElementById("nm_hh")?.value;
  const mm = document.getElementById("nm_mm")?.value;
  const phase = document.getElementById("nm_phase")?.value || "";
  const prev = document.getElementById("nm_preview");
  if (!prev || !d || !m || !y || !hh || !mm) return;
  const label = nmBuildDayLabel(d, m, y);
  const iso   = nmBuildISO(d, m, y, hh, mm);
  prev.innerHTML = `<b>${phase} · ${label} · ${hh}:${mm} (Chile)</b><br><span>${iso}</span>`;
}

async function adminAddMatch() {
  const home     = document.getElementById("nm_home")?.value.trim();
  const homeFlag = document.getElementById("nm_home_flag")?.value.trim().toUpperCase();
  const away     = document.getElementById("nm_away")?.value.trim();
  const awayFlag = document.getElementById("nm_away_flag")?.value.trim().toUpperCase();
  const phase    = document.getElementById("nm_phase")?.value;
  const d  = document.getElementById("nm_d")?.value;
  const m  = document.getElementById("nm_m")?.value;
  const y  = document.getElementById("nm_y")?.value;
  const hh = document.getElementById("nm_hh")?.value;
  const mm = document.getElementById("nm_mm")?.value;

  // Validaciones
  if (!home || !homeFlag || !away || !awayFlag) {
    showToast("Completa los nombres y códigos FIFA de ambos equipos", "error"); return;
  }
  if (homeFlag.length < 2 || awayFlag.length < 2) {
    showToast("Los códigos FIFA deben tener 2-3 letras", "error"); return;
  }

  const day     = nmBuildDayLabel(d, m, y);
  const timeISO = nmBuildISO(d, m, y, hh, mm);

  // Generar ID único que no colisione con los existentes
  const existingIds = DB.matches.map(mx => mx.id);
  let num = DB.matches.length + 1;
  let newId = `m${String(num).padStart(2, "0")}`;
  while (existingIds.includes(newId)) { num++; newId = `m${String(num).padStart(2, "0")}`; }

  const newMatch = { id: newId, phase, day, timeISO, home, homeFlag, away, awayFlag };

  try {
    // Guardar en Supabase tabla extra_matches
    await supabase.upsert("extra_matches", {
      match_id:  newId,
      phase, day,
      time_iso:  timeISO,
      home,      home_flag: homeFlag,
      away,      away_flag: awayFlag,
    });

    // Actualizar cache local y re-ordenar por hora
    DB.matches.push({ ...newMatch, result: null, winner: null, done: false });
    DB.matches.sort((a, b) => new Date(a.timeISO) - new Date(b.timeISO));

    showToast(`✅ ${homeFlag} ${home} vs ${away} ${awayFlag} · ${day} ${hh}:${mm}`, "success");

    // Limpiar campos de texto (mantener selects en sus valores)
    ["nm_home","nm_home_flag","nm_away","nm_away_flag"].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = "";
    });
    const prev = document.getElementById("nm_preview");
    if (prev) prev.innerHTML = "Completa los campos para ver la vista previa";

    // Refrescar vistas
    renderAdmin();
    renderMatches();
  } catch(e) {
    showToast("Error al guardar en Supabase. ¿Existe la tabla extra_matches?", "error");
    console.error(e);
  }
}

function copyDaySummary(){
  const ranking=calcRanking();
  const playedToday=DB.matches.filter(m=>m.done);
  const today=new Date().toLocaleDateString("es-CL",{day:"2-digit",month:"long"});
  let text=`⚽ *QUINIELA MUNDIAL 2026*\n📅 Resumen ${today}\n\n`;

  if(playedToday.length>0){
    text+=`*Resultados del día:*\n`;
    playedToday.slice(-4).forEach(m=>{
      if(m.result)text+=`• ${m.homeFlag} ${m.home} ${m.result.homeScore}–${m.result.awayScore} ${m.away} ${m.awayFlag}\n`;
    });
    text+="\n";
  }

  text+=`*🏆 Tabla de posiciones:*\n`;
  const medals=["🥇","🥈","🥉"];
  ranking.slice(0,Math.min(5,ranking.length)).forEach((u,i)=>{
    text+=`${medals[i]||`${i+1}.`} ${u.name} — *${u.pts} pts*\n`;
  });
  if(ranking.length>5)text+=`_...y ${ranking.length-5} participante${ranking.length-5>1?"s":" más"}_\n`;
  text+=`\n_¡Haz tus picks antes de que cierren los partidos!_`;

  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast("✅ Resumen copiado — pégalo en WhatsApp","success")).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");showToast("✅ Resumen copiado","success");}
  catch{showToast("No se pudo copiar. Cópialo manualmente.","error");}
  document.body.removeChild(ta);
}

async function adminSaveMatch(matchId){
  const match=DB.matches.find(m=>m.id===matchId);
  const hs=parseInt(document.getElementById(`adm_hs_${matchId}`).value);
  const as_=parseInt(document.getElementById(`adm_as_${matchId}`).value);
  const winner=document.getElementById(`adm_w_${matchId}`).value;
  const done=document.getElementById(`adm_done_${matchId}`).value==="1";
  const payload={match_id:matchId,home_score:isNaN(hs)?null:hs,away_score:isNaN(as_)?null:as_,winner:winner||null,done};
  try{
    await supabase.upsert("match_results",payload);
    if(!isNaN(hs)&&!isNaN(as_))match.result={homeScore:hs,awayScore:as_};
    match.winner=winner||null;match.done=done;
    showToast(`✅ ${match.homeFlag} vs ${match.awayFlag} guardado`,"success");
    renderMatches();renderRanking();renderAdmin();
  }catch(e){showToast("Error al guardar","error");console.error(e);}
}

// Actualiza el badge OT y el selector de clasificado en tiempo real
function adminOnScoreInput(userId, matchId) {
  const match  = DB.matches.find(m => m.id === matchId);
  const hsEl   = document.getElementById(`mhs_${userId}_${matchId}`);
  const asEl   = document.getElementById(`mas_${userId}_${matchId}`);
  if (!hsEl || !asEl) return;
  const ph = parseInt(hsEl.value), pa = parseInt(asEl.value);
  const hasScore = !isNaN(ph) && !isNaN(pa);
  const pickOT   = hasScore ? (ph>pa?"1":ph===pa?"X":"2") : null;

  // Recuperar advance actual del pick en cache
  const pick = DB.picks.find(p=>p.user_id===userId&&p.match_id===matchId);

  const otBadge = pickOT
    ? `<div class="modal-ot-derived ${pickOT==="1"?"home":pickOT==="X"?"draw":"away"}">
         ${ pickOT==="1" ? `🏠 LOCAL — ${match.homeFlag} gana`
          : pickOT==="X" ? `🤝 EMPATE — elige quién avanza`
          :                `✈️ VISITA — ${match.awayFlag} gana` }
       </div>`
    : `<div class="modal-ot-derived">Ingresa marcador</div>`;

  const advRow = pickOT==="X"
    ? `<div class="modal-advance-row">
         <span class="modal-advance-label">¿CLASIFICA?</span>
         <button class="modal-advance-btn ${pick?.advance==="home"?"sel":""}"
           onclick="adminSetAdvance('${userId}','${matchId}','home')">${match.homeFlag} ${match.home}</button>
         <button class="modal-advance-btn ${pick?.advance==="away"?"sel":""}"
           onclick="adminSetAdvance('${userId}','${matchId}','away')">${match.awayFlag} ${match.away}</button>
       </div>`
    : "";

  // Re-renderizar solo el bloque de OT + advance + inputs
  const wrapper = document.getElementById(`meobd_${userId}_${matchId}`);
  if (!wrapper) return;
  const newHs = hsEl.value, newAs = asEl.value;
  wrapper.innerHTML = `
    ${otBadge}${advRow}
    <div class="modal-score-row">
      <div class="modal-score-inputs">
        <input class="modal-score-input" type="number" min="0" max="20"
          id="mhs_${userId}_${matchId}" value="${newHs}" placeholder="–"
          oninput="adminOnScoreInput('${userId}','${matchId}')" />
        <span class="modal-score-sep">:</span>
        <input class="modal-score-input" type="number" min="0" max="20"
          id="mas_${userId}_${matchId}" value="${newAs}" placeholder="–"
          oninput="adminOnScoreInput('${userId}','${matchId}')" />
      </div>
      <button class="modal-save-pick-btn" onclick="adminSavePickForUser('${userId}','${matchId}')">💾</button>
      <button class="modal-clear-pick-btn" onclick="adminClearPickForUser('${userId}','${matchId}')">✕</button>
    </div>`;
}

// Guarda o actualiza un advance en el cache local sin ir a Supabase
// (el Supabase se actualiza al guardar con 💾)
function adminSetAdvance(userId, matchId, value) {
  let pick = DB.picks.find(p=>p.user_id===userId&&p.match_id===matchId);
  if (!pick) { pick={user_id:userId,match_id:matchId,ot:null,home_score:null,away_score:null,advance:null}; DB.picks.push(pick); }
  pick.advance = pick.advance===value ? null : value;
  // Re-renderizar solo el advance row
  adminOnScoreInput(userId, matchId);
}

// Guardar pick editado por admin en Supabase
async function adminSavePickForUser(userId, matchId) {
  const match  = DB.matches.find(m=>m.id===matchId);
  const hsEl   = document.getElementById(`mhs_${userId}_${matchId}`);
  const asEl   = document.getElementById(`mas_${userId}_${matchId}`);
  if (!hsEl || !asEl) return;
  const ph = hsEl.value, pa = asEl.value;
  if (ph===""||pa==="") { showToast("Ingresa ambos valores del marcador","error"); return; }

  const phn = parseInt(ph), pan = parseInt(pa);
  const derivedOT = phn>pan?"1":phn===pan?"X":"2";

  // Si es empate, verificar que se eligió clasificado
  let pick = DB.picks.find(p=>p.user_id===userId&&p.match_id===matchId);
  const advance = derivedOT==="X" ? (pick?.advance||null) : null;
  if (derivedOT==="X"&&!advance) { showToast("Elige quién clasifica en el empate","error"); return; }

  const payload = {
    user_id:    userId,
    match_id:   matchId,
    ot:         derivedOT,
    home_score: parseInt(ph),
    away_score: parseInt(pa),
    advance:    advance,
  };

  try {
    await supabase.upsert("picks", payload);
    // Actualizar cache local
    if (!pick) { pick={user_id:userId,match_id:matchId}; DB.picks.push(pick); }
    Object.assign(pick, payload);
    showToast(`✅ Pick guardado: ${match.homeFlag}${ph} – ${pa}${match.awayFlag}`,"success");
    // Refrescar modal y ranking
    _renderModalContent(userId);
    renderRanking();
    renderAdmin();
  } catch(e) {
    showToast("Error al guardar el pick","error"); console.error(e);
  }
}

// Limpiar pick de un partido para un jugador
async function adminClearPickForUser(userId, matchId) {
  const match = DB.matches.find(m=>m.id===matchId);
  if (!confirm(`¿Eliminar el pick de ${match?.homeFlag} vs ${match?.awayFlag}?`)) return;
  try {
    await fetch(
      `${CONFIG.SUPABASE_URL}/rest/v1/picks?user_id=eq.${userId}&match_id=eq.${matchId}`,
      { method:"DELETE", headers:SB_HEADERS() }
    );
    DB.picks = DB.picks.filter(p=>!(p.user_id===userId&&p.match_id===matchId));
    showToast("✅ Pick eliminado","success");
    _renderModalContent(userId);
    renderRanking();
    renderAdmin();
  } catch(e) {
    showToast("Error al eliminar el pick","error"); console.error(e);
  }
}

/* ── ELIMINAR / DESBLOQUEAR USUARIO ──────────────────────────────────────── */
function confirmDeleteUser(userId){
  const card=document.getElementById(`pcard_${userId}`);if(!card)return;
  if(userId===currentUser.id){showToast("No puedes eliminarte a ti mismo","error");return;}
  if(card.classList.contains("confirm-delete")){
    card.classList.remove("confirm-delete");card.querySelector(".confirm-delete-bar")?.remove();return;
  }
  const user=DB.users.find(u=>u.id===userId);
  card.classList.add("confirm-delete");
  card.style.borderColor="var(--danger)";
  const bar=document.createElement("div");
  bar.className="confirm-delete-bar";
  bar.style.cssText="display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(224,82,82,.3)";
  bar.innerHTML=`
    <button style="flex:1;background:var(--gray-2);border:1px solid var(--gray-3);border-radius:6px;padding:6px 4px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer" onclick="event.stopPropagation();cancelDeleteUser('${userId}')">CANCELAR</button>
    <button style="flex:1;background:var(--danger);border:none;border-radius:6px;padding:6px 4px;font-size:10px;font-weight:700;color:var(--white);cursor:pointer" onclick="event.stopPropagation();deleteUser('${userId}')">🗑 ELIMINAR</button>`;
  card.appendChild(bar);
}
function cancelDeleteUser(userId){
  const card=document.getElementById(`pcard_${userId}`);if(!card)return;
  card.classList.remove("confirm-delete");card.style.borderColor="";
  card.querySelector(".confirm-delete-bar")?.remove();
}
async function deleteUser(userId){
  const user=DB.users.find(u=>u.id===userId);if(!user)return;
  showLoading(`Eliminando a ${user.name}...`);
  try{
    await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/picks?user_id=eq.${userId}`,{method:"DELETE",headers:SB_HEADERS()});
    await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/users?id=eq.${userId}`,{method:"DELETE",headers:SB_HEADERS()});
    // Lista negra
    const bannedRaw=await supabase.get("settings","?key=eq.banned_names").catch(()=>[]);
    const bannedList=bannedRaw?.[0]?.value?JSON.parse(bannedRaw[0].value):[];
    if(!bannedList.map(n=>n.toLowerCase()).includes(user.name.toLowerCase())){
      bannedList.push(user.name);
      await supabase.upsert("settings",{key:"banned_names",value:JSON.stringify(bannedList)});
    }
    DB.bannedNames=bannedList;
    DB.picks=DB.picks.filter(p=>p.user_id!==userId);
    DB.users=DB.users.filter(u=>u.id!==userId);
    hideLoading();showToast(`✅ ${user.name} eliminado`,"success");
    renderAdmin();renderRanking();
  }catch(e){hideLoading();showToast("Error al eliminar","error");console.error(e);}
}
async function unbanUser(name){
  DB.bannedNames=(DB.bannedNames||[]).filter(n=>n.toLowerCase()!==name.toLowerCase());
  await supabase.upsert("settings",{key:"banned_names",value:JSON.stringify(DB.bannedNames)});
  showToast(`✅ ${name} puede volver a registrarse`,"success");renderAdmin();
}

function showToast(msg,type="success"){

  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("visible"),2800);
}

  }

    showLoading("Conectando...");await loadAll();hideLoading();

})();
