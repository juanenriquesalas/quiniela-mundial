<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Quiniela del Mundial 2026 · Fase eliminatoria · Pronósticos de partidos" />
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="⚽ Quiniela Mundial 2026" />
  <meta property="og:description" content="Haz tus pronósticos de la fase eliminatoria. ¿Quién será el campeón?" />
  <title>⚽ Quiniela Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep:  #0a1628;
      --green-field: #1a472a;
      --green-mid:   #2d6a4f;
      --gold:        #f4c430;
      --gold-dim:    #c9a227;
      --white:       #f5f5f0;
      --gray-1:      #1c1c2e;
      --gray-2:      #2a2a3e;
      --gray-3:      #3d3d55;
      --muted:       #8888aa;
      --danger:      #e05252;
      --success:     #4caf87;
      --blue:        #4a9eff;
      --r:           12px;
      --rs:          8px;
    }
    /* LIGHT MODE */
    body.light {
      --green-deep:  #f0f4f8;
      --green-field: #1a472a;
      --green-mid:   #2d6a4f;
      --gold:        #c9a227;
      --gold-dim:    #a88320;
      --white:       #1a1a2e;
      --gray-1:      #ffffff;
      --gray-2:      #e8edf2;
      --gray-3:      #ccd5de;
      --muted:       #6677aa;
      --danger:      #c0392b;
      --success:     #27ae60;
      --blue:        #2980b9;
    }
    body.light .app-header { background: linear-gradient(135deg, #1a472a 0%, #0d2a14 100%); }
    body.light .login-wrap  { background: linear-gradient(180deg, #1a472a 0%, #f0f4f8 40%); }
    body.light .login-logo, body.light .logo { color: var(--gold); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--green-deep); color: var(--white);
      min-height: 100vh; overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--gray-3); border-radius: 4px; }

    /* HEADER */
    .app-header {
      background: linear-gradient(135deg, var(--green-field) 0%, var(--green-deep) 100%);
      border-bottom: 2px solid var(--gold);
      padding: 16px 14px 12px; position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .logo { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--gold); line-height: 1; }
    .logo span { color: var(--white); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .theme-toggle {
      background: var(--gray-2); border: 1px solid var(--gray-3); border-radius: 50%;
      width: 30px; height: 30px; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s; flex-shrink: 0;
    }
    .theme-toggle:active { transform: scale(0.9); }
    .user-badge {
      background: var(--gray-2); border: 1px solid var(--gray-3); border-radius: 20px;
      padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--white);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .user-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .nav-tabs { display: flex; gap: 5px; }
    .nav-tab {
      flex: 1; background: transparent; border: 1px solid var(--gray-3); border-radius: 20px;
      padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted);
      cursor: pointer; text-align: center; letter-spacing: 0.4px; transition: all 0.18s;
    }
    .nav-tab.active { background: var(--gold); border-color: var(--gold); color: var(--green-deep); }

    /* LAYOUT */
    .main { padding: 14px 13px 96px; max-width: 520px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; }
    .section-label {
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 12px; letter-spacing: 3px; color: var(--gold); margin-bottom: 10px; padding: 0 2px;
    }

    /* DAY GROUP */
    .day-group { margin-bottom: 18px; }
    .day-header { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .day-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .day-line { flex: 1; height: 1px; background: var(--gray-2); }

    /* MATCH CARD */
    .match-card {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--r); margin-bottom: 9px; overflow: hidden; transition: border-color 0.2s;
    }
    .match-card.saved  { border-color: var(--success); }
    .match-card.locked { border-color: var(--gray-3); opacity: 0.72; }
    .match-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px 6px; background: var(--gray-2); font-size: 11px;
    }
    .match-time { color: var(--gold); font-weight: 700; letter-spacing: 0.4px; }
    .match-status { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .status-open   { background: rgba(76,175,135,.18); color: var(--success); }
    .status-soon   { background: rgba(244,196,48,.18);  color: var(--gold); }
    .status-locked { background: rgba(160,160,180,.13); color: var(--muted); }
    .status-done   { background: rgba(76,175,135,.28);  color: var(--success); }
    .match-teams { display: flex; align-items: center; padding: 11px 12px 7px; gap: 8px; }
    .team { flex: 1; text-align: center; }
    .team-flag {
      display: inline-block; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 13px; letter-spacing: 1.5px; background: var(--gray-3); color: var(--white);
      border-radius: 5px; padding: 3px 7px 2px; margin-bottom: 5px; line-height: 1.2;
    }
    .team-name { font-size: 11px; font-weight: 700; color: var(--white); line-height: 1.2; }
    .vs-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .vs-text { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 17px; color: var(--gray-3); }
    .result-score { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }

    /* PICK CONTROLS */
    .prediction-area { padding: 0 12px 12px; }
    .ot-row { display: flex; gap: 5px; margin-bottom: 7px; }
    .ot-btn {
      flex: 1; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 8px 4px; font-size: 11px; font-weight: 700;
      color: var(--muted); cursor: pointer; transition: all 0.14s; letter-spacing: 0.2px;
    }
    .ot-btn:active { transform: scale(0.95); }
    .ot-btn.sel-1 { border-color: var(--blue);   background: rgba(74,158,255,.15); color: var(--blue); }
    .ot-btn.sel-x { border-color: var(--gold);   background: rgba(244,196,48,.15); color: var(--gold); }
    .ot-btn.sel-2 { border-color: var(--danger); background: rgba(224,82,82,.15);  color: var(--danger); }
    .score-row { display: flex; align-items: center; gap: 6px; }
    .score-label { font-size: 10px; color: var(--muted); white-space: nowrap; font-weight: 600; }
    .score-inputs { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
    .score-input {
      width: 44px; height: 36px; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); color: var(--white); font-size: 18px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-input:focus { outline: none; border-color: var(--gold); }
    .score-sep { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gray-3); }
    .save-btn {
      background: var(--green-mid); border: none; border-radius: var(--rs);
      padding: 0 13px; height: 36px; color: var(--white); font-size: 12px;
      font-weight: 700; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .save-btn:active { background: var(--success); }
    .points-hint { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: right; }
    .points-hint b { color: var(--gold); }
    .locked-msg { padding: 9px 12px 12px; font-size: 11px; color: var(--muted); text-align: center; }
    .locked-msg .lock-icon { font-size: 18px; display: block; margin-bottom: 4px; }
    .my-pick-badge { display: flex; justify-content: center; gap: 8px; padding: 6px 12px 10px; font-size: 11px; }
    .pick-tag { background: var(--gray-2); border: 1px solid var(--gray-3); border-radius: 6px; padding: 3px 9px; font-weight: 700; color: var(--muted); }
    .pick-tag.ot-1 { border-color: var(--blue);   color: var(--blue); }
    .pick-tag.ot-x { border-color: var(--gold);   color: var(--gold); }
    .pick-tag.ot-2 { border-color: var(--danger); color: var(--danger); }
    .pick-tag.score { color: var(--white); }

    /* CHAMPION */
    .champion-section {
      background: linear-gradient(135deg, rgba(244,196,48,.07) 0%, transparent 100%);
      border: 2px solid var(--gold-dim); border-radius: var(--r); padding: 15px; margin-bottom: 18px;
    }
    .champion-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 21px; color: var(--gold); letter-spacing: 2px; margin-bottom: 3px; }
    .champion-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 13px; line-height: 1.4; }
    .champion-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; margin-bottom: 11px; }
    .champ-btn {
      background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 8px 4px 6px; cursor: pointer; text-align: center; transition: all 0.14s;
    }
    .champ-btn:active { transform: scale(0.91); }
    .champ-btn.selected { border-color: var(--gold); background: rgba(244,196,48,.13); }
    .champ-btn.locked-champ { opacity: 0.45; cursor: not-allowed; }
    .champ-flag {
      display: inline-block; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 11px; letter-spacing: 1px; background: var(--gray-3); color: var(--white);
      border-radius: 4px; padding: 2px 5px 1px; margin-bottom: 4px; line-height: 1.3; border: 1px solid var(--gray-3);
    }
    .champ-btn.selected .champ-flag { background: rgba(244,196,48,.18); border-color: var(--gold); color: var(--gold); }
    .champ-name { font-size: 8px; font-weight: 700; color: var(--muted); margin-top: 2px; line-height: 1; }
    .champ-btn.selected .champ-name { color: var(--gold); }
    .save-champ-btn {
      width: 100%; background: var(--gold); border: none; border-radius: var(--rs);
      padding: 11px; font-size: 14px; font-weight: 700; color: var(--green-deep);
      cursor: pointer; letter-spacing: 0.4px; transition: opacity 0.18s;
    }
    .save-champ-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* RANKING */
    .ranking-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 14px; }
    .rank-stat { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 10px 8px; text-align: center; }
    .rank-stat-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 26px; color: var(--gold); line-height: 1; }
    .rank-stat-label { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; margin-top: 2px; }
    .podium-row { display: flex; align-items: stretch; gap: 6px; margin-bottom: 14px; }
    .podium-card { flex: 1; background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--r); padding: 12px 8px; text-align: center; }
    .podium-card.p1 { border-color: #ffd700; background: rgba(255,215,0,.05); }
    .podium-card.p2 { border-color: #c0c0c0; background: rgba(192,192,192,.04); }
    .podium-card.p3 { border-color: #cd7f32; background: rgba(205,127,50,.04); }
    .podium-medal { font-size: 22px; display: block; margin-bottom: 4px; }
    .podium-name { font-size: 12px; font-weight: 700; color: var(--white); line-height: 1.2; margin-bottom: 3px; word-break: break-word; }
    .podium-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 28px; color: var(--gold); line-height: 1; }
    .podium-pts-lbl { font-size: 9px; color: var(--muted); }
    .podium-champ { font-size: 9px; color: var(--muted); margin-top: 4px; }
    .ranking-list { margin-top: 4px; }
    .ranking-row {
      display: flex; align-items: center; background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--rs); padding: 9px 12px; margin-bottom: 5px; gap: 10px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .ranking-row.me { border-color: var(--gold); background: rgba(244,196,48,.04); }
    .ranking-row.expanded { border-radius: var(--rs) var(--rs) 0 0; border-bottom-color: transparent; }
    .rank-pos { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gray-3); width: 22px; text-align: center; flex-shrink: 0; }
    .rank-pos.top { color: var(--gold); }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .rank-pts-block { text-align: right; flex-shrink: 0; }
    .rank-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }
    .rank-pts-lbl { font-size: 9px; color: var(--muted); }
    .rank-detail {
      display: none; background: var(--gray-2); border: 1px solid var(--gray-2); border-top: none;
      border-radius: 0 0 var(--rs) var(--rs); padding: 8px 12px 10px; margin-bottom: 5px;
    }
    .rank-detail.open { display: block; }
    .detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-bottom: 8px; }
    .detail-cell { background: var(--gray-1); border-radius: 6px; padding: 7px 6px; text-align: center; }
    .detail-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gold); line-height: 1; }
    .detail-lbl { font-size: 9px; color: var(--muted); margin-top: 1px; }
    .detail-picks-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
    .detail-pick-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--gray-3); font-size: 11px; }
    .detail-pick-row:last-child { border-bottom: none; }
    .detail-pick-match { color: var(--muted); flex: 1; }
    .detail-pick-sel { font-weight: 700; width: 40px; text-align: center; }
    .detail-pick-score { color: var(--muted); width: 44px; text-align: center; }
    .detail-pick-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 15px; color: var(--gold); width: 24px; text-align: right; }
    .detail-pick-pts.zero { color: var(--gray-3); }


    /* ─── STATS: PICKS POR PARTIDO ──────────────────────────────── */
    .stats-match-section { margin-bottom: 8px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--gray-2); }
    .stats-match-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; background: var(--gray-2); cursor: pointer; user-select: none;
      gap: 8px;
    }
    .stats-match-header:active { background: var(--gray-3); }
    .stats-match-title-block { flex: 1; min-width: 0; }
    .stats-match-name { font-size: 12px; font-weight: 700; color: var(--white); }
    .stats-match-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .stats-match-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stats-result-box {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 16px; color: var(--gold); background: var(--gray-1);
      border-radius: 6px; padding: 2px 10px; white-space: nowrap;
    }
    .stats-result-box.pending { font-size: 10px; color: var(--muted); padding: 4px 10px; }
    .stats-match-arrow { font-size: 11px; color: var(--muted); transition: transform .2s; display: inline-block; }
    .stats-match-arrow.open { transform: rotate(180deg); }
    /* Chips de distribución en header */
    .stats-dist-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .sdchip { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
    .sdchip-home { background: rgba(74,158,255,.15);  color: var(--blue); }
    .sdchip-draw { background: rgba(244,196,48,.15);  color: var(--gold); }
    .sdchip-away { background: rgba(224,82,82,.15);   color: var(--danger); }
    .sdchip-none { background: rgba(160,160,180,.12); color: var(--muted); }
    .sdchip-pop  { background: rgba(76,175,135,.15);  color: var(--success); }
    /* Cuerpo acordeón partido */
    .stats-match-body { display: none; border-top: 1px solid var(--gray-2); background: var(--gray-1); }
    .stats-match-body.open { display: block; }
    /* Barras */
    .stats-bars-wrap { padding: 10px 12px 8px; }
    .stats-bar-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
    .stats-bar-lbl { font-size: 10px; color: var(--muted); font-weight: 700; width: 60px; text-align: right; flex-shrink: 0; }
    .stats-bar-track { flex: 1; height: 8px; background: var(--gray-2); border-radius: 4px; overflow: hidden; }
    .stats-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }
    .fill-home { background: var(--blue); }
    .fill-draw { background: var(--gold); }
    .fill-away { background: var(--danger); }
    .stats-bar-val { font-size: 10px; font-weight: 700; width: 36px; flex-shrink: 0; }
    .stats-bar-val.home { color: var(--blue); }
    .stats-bar-val.draw { color: var(--gold); }
    .stats-bar-val.away { color: var(--danger); }
    /* Popular score */
    .stats-popular { font-size: 10px; color: var(--muted); padding: 0 12px 8px; }
    .stats-popular b { color: var(--success); }
    /* Tabla picks individuales */
    .stats-picks-table { border-top: 1px solid var(--gray-2); }
    .stats-picks-head {
      display: grid; grid-template-columns: 1fr 54px 54px 28px;
      padding: 5px 12px; font-size: 9px; font-weight: 700;
      color: var(--muted); letter-spacing: 0.5px; border-bottom: 1px solid var(--gray-2);
    }
    .stats-pick-row {
      display: grid; grid-template-columns: 1fr 54px 54px 28px;
      padding: 5px 12px; font-size: 11px; border-bottom: 1px solid var(--gray-2);
      align-items: center;
    }
    .stats-pick-row:last-child { border-bottom: none; }
    .stats-pick-name { font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats-pick-ot   { font-weight: 700; text-align: center; }
    .stats-pick-sc   { color: var(--muted); text-align: center; font-size: 10px; }
    .stats-pick-pts  { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 15px; color: var(--gold); text-align: right; }
    .stats-pick-pts.zero { color: var(--gray-3); }
    .stats-locked-msg { padding: 10px 12px; font-size: 10px; color: var(--muted); text-align: center; }

    /* ─── RANKING: GRÁFICO DE EVOLUCIÓN ─────────────────────────── */
    .evo-chart-wrap { margin-top: 10px; padding: 10px 0 4px; border-top: 1px solid var(--gray-2); }
    .evo-chart-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
    .evo-svg { width: 100%; overflow: visible; display: block; }
    .evo-tooltip { font-size: 9px; fill: var(--muted); }

    /* STREAK */
    .streak-badge {
      display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px; background: rgba(244,196,48,.15);
      color: var(--gold); border: 1px solid rgba(244,196,48,.3); white-space: nowrap;
    }
    .streak-badge.neg { background: rgba(160,160,180,.12); color: var(--muted); border-color: rgba(160,160,180,.2); }
    .streak-badge.fire { background: rgba(224,100,50,.18); color: #ff7043; border-color: rgba(224,100,50,.35); }

    /* STATS */
    .stats-global-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin-bottom: 16px; }
    .stats-global-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 12px 10px; text-align: center; }
    .stats-global-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 28px; color: var(--gold); line-height: 1; margin-bottom: 2px; }
    .stats-global-lbl { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }

    /* PHASE RANKING in STATS */
    .phase-rank-section { margin-bottom: 18px; }
    .phase-rank-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; background: var(--gray-2); border-radius: var(--r) var(--r) 0 0;
      cursor: pointer; user-select: none;
    }
    .phase-rank-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 15px; letter-spacing: 1.5px; color: var(--gold); }
    .phase-rank-meta { font-size: 10px; color: var(--muted); }
    .phase-rank-arrow { font-size: 11px; color: var(--muted); transition: transform .2s; }
    .phase-rank-arrow.open { transform: rotate(180deg); }
    .phase-rank-body { display: none; background: var(--gray-1); border: 1px solid var(--gray-2); border-top: none; border-radius: 0 0 var(--r) var(--r); padding: 10px 12px 12px; }
    .phase-rank-body.open { display: block; }
    .phase-podium { display: flex; gap: 6px; margin-bottom: 10px; }
    .phase-podium-card {
      flex: 1; background: var(--gray-2); border-radius: var(--rs); padding: 10px 6px; text-align: center;
      border: 1px solid var(--gray-3);
    }
    .phase-podium-card.pp1 { border-color: #ffd700; }
    .phase-podium-card.pp2 { border-color: #c0c0c0; }
    .phase-podium-card.pp3 { border-color: #cd7f32; }
    .phase-podium-medal { font-size: 18px; display: block; margin-bottom: 3px; }
    .phase-podium-name { font-size: 11px; font-weight: 700; color: var(--white); word-break: break-word; margin-bottom: 3px; line-height: 1.2; }
    .phase-podium-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 22px; color: var(--gold); line-height: 1; }
    .phase-podium-lbl { font-size: 8px; color: var(--muted); }
    .phase-full-list { border-top: 1px solid var(--gray-2); padding-top: 8px; }
    .phase-rank-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 0;
      border-bottom: 1px solid var(--gray-2); font-size: 12px;
    }
    .phase-rank-row:last-child { border-bottom: none; }
    .phase-rank-pos { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 16px; color: var(--gray-3); width: 18px; text-align: center; flex-shrink: 0; }
    .phase-rank-pos.top { color: var(--gold); }
    .phase-rank-name { flex: 1; font-weight: 600; color: var(--white); }
    .phase-rank-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 18px; color: var(--gold); }

    /* RESUMEN JORNADA */
    .summary-btn {
      width: 100%; background: var(--gray-2); border: 1px solid var(--gray-3);
      border-radius: var(--rs); padding: 11px; font-size: 13px; font-weight: 700;
      color: var(--white); cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 7px; margin-bottom: 14px; transition: border-color 0.15s;
    }
    .summary-btn:active { border-color: var(--gold); color: var(--gold); }

    /* ADMIN */
    .admin-section { margin-bottom: 20px; }
    .admin-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 16px; color: var(--gold); letter-spacing: 2px; margin-bottom: 10px; }
    .admin-match-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--r); padding: 13px; margin-bottom: 7px; }
    .admin-match-card.done-card { border-color: var(--success); }
    .admin-match-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; color: var(--white); }
    .admin-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .admin-label { font-size: 10px; color: var(--muted); min-width: 78px; font-weight: 600; letter-spacing: 0.4px; }
    .admin-score-input {
      width: 44px; height: 36px; background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); color: var(--white); font-size: 18px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .admin-score-input::-webkit-outer-spin-button,
    .admin-score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .admin-score-input:focus { outline: none; border-color: var(--gold); }
    .admin-select { flex: 1; background: var(--gray-2); border: 1.5px solid var(--gray-3); border-radius: var(--rs); color: var(--white); font-size: 13px; padding: 8px; }
    .admin-select:focus { outline: none; border-color: var(--gold); }
    .admin-footer { display: flex; gap: 7px; align-items: center; margin-top: 4px; }
    .admin-save-btn { flex: 1; background: var(--green-mid); border: none; border-radius: var(--rs); padding: 9px 14px; color: var(--white); font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.18s; }
    .admin-save-btn:active { background: var(--success); }
    .admin-picks-summary { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray-2); }
    .admin-picks-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 5px; }
    .admin-pick-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--gray-2); }
    .admin-pick-row:last-child { border-bottom: none; }
    .admin-pick-name { flex: 1; color: var(--white); }
    .admin-pick-ot { width: 30px; text-align: center; font-weight: 700; }
    .admin-pick-sc { width: 50px; text-align: center; color: var(--muted); }
    .admin-pick-pts { width: 28px; text-align: right; font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 15px; color: var(--gold); }
    .admin-pick-pts.zero { color: var(--gray-3); }

    /* PARTICIPANTS */
    .participants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .participant-card { background: var(--gray-1); border: 1px solid var(--gray-2); border-radius: var(--rs); padding: 11px 12px; cursor: pointer; transition: border-color 0.15s; position: relative; }
    .participant-card:active { border-color: var(--gray-3); }
    .participant-card.admin-user { border-color: var(--gold-dim); }
    .participant-name { font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .participant-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 10px; margin-bottom: 6px; }
    .participant-badge.admin { background: rgba(244,196,48,.18); color: var(--gold); }
    .participant-badge.user  { background: rgba(76,175,135,.15); color: var(--success); }
    .participant-champ { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
    .participant-champ b { color: var(--white); }
    .participant-progress { display: flex; gap: 3px; flex-wrap: wrap; }
    .prog-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .prog-dot.done-correct { background: var(--success); }
    .prog-dot.done-wrong   { background: var(--danger); }
    .prog-dot.has-pick     { background: var(--green-mid); }
    .prog-dot.no-pick      { background: var(--gray-3); }
    .participant-stats { display: flex; gap: 6px; margin-top: 7px; border-top: 1px solid var(--gray-2); padding-top: 6px; }
    .pstat { flex: 1; text-align: center; }
    .pstat-val { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 18px; color: var(--gold); line-height: 1; }
    .pstat-lbl { font-size: 8px; color: var(--muted); margin-top: 1px; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 500; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: var(--gray-1); border-radius: 18px 18px 0 0; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 0 0 32px; animation: slideUp .22s ease; }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 36px; height: 4px; background: var(--gray-3); border-radius: 2px; margin: 12px auto 16px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px; border-bottom: 1px solid var(--gray-2); margin-bottom: 12px; }
    .modal-title { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 1px; }
    .modal-close { background: var(--gray-2); border: none; border-radius: 50%; width: 30px; height: 30px; color: var(--white); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 0 16px; }
    .modal-champ-row { background: var(--gray-2); border-radius: var(--rs); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .modal-champ-icon { font-size: 22px; }
    .modal-champ-text { font-size: 13px; }
    .modal-champ-text b { color: var(--gold); }
    .modal-pick-row { display: grid; grid-template-columns: 1fr 54px 54px 28px; align-items: center; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--gray-2); font-size: 11px; }
    .modal-pick-row:last-child { border-bottom: none; }
    .modal-pick-match { color: var(--muted); font-size: 10px; }
    .modal-pick-match b { color: var(--white); font-size: 11px; }
    .modal-pick-ot { font-weight: 700; text-align: center; }
    .modal-pick-sc { color: var(--muted); text-align: center; }
    .modal-pick-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 16px; color: var(--gold); text-align: right; }
    .modal-pick-pts.zero { color: var(--gray-3); }
    .modal-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 14px; background: var(--gray-2); border-radius: var(--rs); }
    .modal-total-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .modal-total-pts { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 30px; color: var(--gold); line-height: 1; }

    /* RECALC */


    /* ─── MODAL ADMIN: EDICIÓN DE PICKS ─────────────────────── */
    .modal-edit-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 9px; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; background: rgba(244,196,48,.15);
      color: var(--gold); border: 1px solid rgba(244,196,48,.25);
      margin-bottom: 10px;
    }
    .modal-pick-edit-row {
      background: var(--gray-2); border-radius: var(--rs);
      padding: 10px 10px 8px; margin-bottom: 7px;
    }
    .modal-pick-edit-match {
      font-size: 11px; font-weight: 700; color: var(--white);
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-pick-edit-pts {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 16px; color: var(--gold);
    }
    .modal-pick-edit-pts.zero { color: var(--gray-3); }
    /* OT derivado badge en modal edición */
    .modal-ot-derived {
      font-size: 11px; font-weight: 700; padding: 5px 10px;
      border-radius: var(--rs); margin-bottom: 7px; text-align: center;
      border: 1.5px dashed var(--gray-3); color: var(--muted);
    }
    .modal-ot-derived.home { border-color: var(--blue);   background: rgba(74,158,255,.10); color: var(--blue); }
    .modal-ot-derived.draw { border-color: var(--gold);   background: rgba(244,196,48,.10); color: var(--gold); }
    .modal-ot-derived.away { border-color: var(--danger); background: rgba(224,82,82,.10);  color: var(--danger); }
    /* Selector clasificado en modal */
    .modal-advance-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
      padding: 7px 8px; background: rgba(244,196,48,.06);
      border: 1px solid rgba(244,196,48,.2); border-radius: var(--rs);
    }
    .modal-advance-label { font-size: 9px; color: var(--gold); font-weight: 700; white-space: nowrap; }
    .modal-advance-btn {
      flex: 1; background: var(--gray-1); border: 1.5px solid var(--gray-3);
      border-radius: 6px; padding: 5px 4px; font-size: 10px; font-weight: 700;
      color: var(--muted); cursor: pointer; text-align: center; transition: all 0.12s;
    }
    .modal-advance-btn.sel { border-color: var(--gold); background: rgba(244,196,48,.18); color: var(--gold); }
    /* Score inputs en modal */
    .modal-score-row { display: flex; align-items: center; gap: 6px; }
    .modal-score-inputs { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; }
    .modal-score-input {
      width: 42px; height: 34px; background: var(--gray-1); border: 1.5px solid var(--gray-3);
      border-radius: 6px; color: var(--white); font-size: 17px; font-weight: 700;
      text-align: center; -moz-appearance: textfield;
    }
    .modal-score-input::-webkit-outer-spin-button,
    .modal-score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .modal-score-input:focus { outline: none; border-color: var(--gold); }
    .modal-score-sep { font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif; font-size: 18px; color: var(--gray-3); }
    .modal-save-pick-btn {
      background: var(--green-mid); border: none; border-radius: 6px;
      padding: 0 10px; height: 34px; color: var(--white); font-size: 12px;
      font-weight: 700; cursor: pointer; white-space: nowrap; transition: background .15s;
    }
    .modal-save-pick-btn:active { background: var(--success); }
    .modal-clear-pick-btn {
      background: transparent; border: 1px solid var(--gray-3); border-radius: 6px;
      padding: 0 8px; height: 34px; color: var(--muted); font-size: 12px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }



    /* ─── SUGERENCIA 1: Banner cierre inminente ─────────────────── */
    .closing-banner {
      background: rgba(224,82,82,.10); border: 1px solid rgba(224,82,82,.35);
      border-radius: var(--rs); padding: 10px 14px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .closing-banner-icon { font-size: 20px; flex-shrink: 0; }
    .closing-banner-text { flex: 1; font-size: 12px; line-height: 1.4; }
    .closing-banner-text b { color: var(--danger); display: block; font-size: 13px; }
    .closing-banner-text span { color: var(--muted); font-size: 11px; }
    .closing-banner-cta {
      font-size: 10px; font-weight: 700; color: var(--danger);
      white-space: nowrap; flex-shrink: 0;
    }

    /* ─── SUGERENCIA 2: Flash de guardado ───────────────────────── */
    @keyframes flashSave {
      0%   { box-shadow: 0 0 0 0 rgba(76,175,135,.7); }
      50%  { box-shadow: 0 0 0 8px rgba(76,175,135,.15); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,135,.0); }
    }
    .match-card.flash-save { animation: flashSave .6s ease; }

    /* ─── SUGERENCIA 3: Vista rápida del día ────────────────────── */
    .today-strip {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px;
    }
    .today-strip-title {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 12px; letter-spacing: 2px; color: var(--gold);
      margin-bottom: 8px;
    }
    .today-match-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 0;
      border-bottom: 1px solid var(--gray-2); font-size: 11px;
    }
    .today-match-row:last-child { border-bottom: none; }
    .today-match-time { font-weight: 700; color: var(--gold); width: 38px; flex-shrink: 0; font-size: 10px; }
    .today-match-teams { flex: 1; color: var(--white); font-weight: 600; }
    .today-match-pick {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 6px; white-space: nowrap;
    }
    .today-pick-ok   { background: rgba(76,175,135,.15);  color: var(--success); }
    .today-pick-none { background: rgba(224,82,82,.12);   color: var(--danger); }
    .today-pick-done { background: rgba(160,160,180,.12); color: var(--muted); }

    /* ─── SUGERENCIA 4: Toast de resultado ──────────────────────── */
    .result-toast {
      position: fixed; top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: var(--gray-1); border-radius: var(--r);
      padding: 12px 18px; z-index: 998; opacity: 0;
      transition: all 0.3s; pointer-events: none;
      border: 2px solid var(--gray-3); text-align: center;
      min-width: 200px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
    .result-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .result-toast.win  { border-color: var(--success); }
    .result-toast.loss { border-color: var(--gray-3); }
    .result-toast-pts  {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 32px; color: var(--gold); line-height: 1;
    }
    .result-toast-pts.zero { color: var(--muted); }
    .result-toast-match { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .result-toast-label { font-size: 12px; font-weight: 700; margin-bottom: 2px; }

    /* ─── SUGERENCIA 5: Distancia al vecino ────────────────────── */
    .rank-gap-wrap {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-top: 6px; margin-bottom: 2px;
    }
    .rank-gap-card {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--rs); padding: 8px 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .rank-gap-card.up   { border-left: 3px solid var(--success); }
    .rank-gap-card.down { border-left: 3px solid var(--gray-3); }
    .rank-gap-card.alone { grid-column: 1 / -1; border-left: 3px solid var(--gold); }
    .rank-gap-arrow { font-size: 14px; line-height: 1; }
    .rank-gap-pts {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 20px; color: var(--gold); line-height: 1;
    }
    .rank-gap-pts.success { color: var(--success); }
    .rank-gap-pts.muted   { color: var(--muted); }
    .rank-gap-label { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; }
    .rank-gap-rival { font-size: 10px; color: var(--white); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ─── STATS: GOLEADOR MÁS APOSTADO ──────────────────────────── */
    .scorer-stats-grid {
      display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 18px;
    }
    .scorer-stats-card {
      background: var(--gray-1); border: 1px solid var(--gray-2);
      border-radius: var(--rs); padding: 10px 10px 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .scorer-stats-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: var(--gray-2); border: 2px solid var(--gray-3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 13px; color: var(--muted);
    }
    .scorer-stats-avatar.leader { border-color: var(--gold); color: var(--gold); background: rgba(244,196,48,.12); }
    .scorer-stats-info { flex: 1; min-width: 0; }
    .scorer-stats-name { font-size: 11px; font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scorer-stats-team { font-size: 9px; color: var(--muted); }
    .scorer-stats-cnt  {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 22px; color: var(--gold); line-height: 1; flex-shrink: 0;
    }
    .scorer-stats-lbl  { font-size: 8px; color: var(--muted); text-align: right; }

    /* ─── GOLEADOR DEL TORNEO ───────────────────────────────────── */
    .scorer-section {
      background: linear-gradient(135deg, rgba(244,196,48,.06) 0%, transparent 100%);
      border: 2px solid rgba(244,196,48,.4); border-radius: var(--r);
      padding: 15px; margin-bottom: 18px;
    }
    .scorer-title {
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;
      font-size: 21px; color: var(--gold); letter-spacing: 2px; margin-bottom: 3px;
    }
    .scorer-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 13px; line-height: 1.4; }
    .scorer-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px; margin-bottom: 11px; }
    .scorer-btn {
      background: var(--gray-2); border: 1.5px solid var(--gray-3);
      border-radius: var(--rs); padding: 10px 8px; cursor: pointer;
      text-align: left; transition: all 0.14s; display: flex; align-items: center; gap: 10px;
    }
    .scorer-btn:active { transform: scale(0.97); }
    .scorer-btn.selected { border-color: var(--gold); background: rgba(244,196,48,.12); }
    .scorer-btn.locked-scorer { opacity: 0.45; cursor: not-allowed; }
    .scorer-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--gray-3); border: 2px solid var(--gray-3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue','Arial Narrow',Arial,sans-serif;

    /* ─── ADMIN: AGREGAR PARTIDO ─────────────────────────────── */

    .recalc-btn { width: 100%; background: var(--gold); border: none; border-radius: var(--rs); padding: 13px; font-size: 14px; font-weight: 700; color: var(--green-deep); cursor: pointer; margin-top: 6px; letter-spacing: 0.3px; }

    /* LOADING */
    .loading-overlay { position: fixed; inset: 0; background: rgba(10,22,40,.88); z-index: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .loading-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--gray-3); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* TOAST */
    .toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--gray-1); border: 1px solid var(--gray-3); border-radius: 30px; padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--white); z-index: 999; opacity: 0; transition: all 0.28s; white-space: nowrap; pointer-events: none; }
    .toast.success { border-color: var(--success); color: var(--success); }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--gray-1); border-top: 1px solid var(--gray-2); display: flex; z-index: 200; }
    .bnav-btn { flex: 1; background: none; border: none; padding: 9px 4px 13px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 0.3px; transition: color 0.18s; }

    /* LOGIN */
    .login-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 24px; background: linear-gradient(180deg, var(--green-field) 0%, var(--green-deep) 40%); }

</head>

const SB_HEADERS = () => ({
  "Content-Type":  "application/json",
  "apikey":        CONFIG.SUPABASE_ANON,
  "Authorization": `Bearer ${CONFIG.SUPABASE_ANON}`,
  "Prefer":        "return=representation",
});
const supabase = {
  async get(table, query="") {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, { headers: SB_HEADERS() });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async upsert(table, data) {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
      method:"POST",
      headers: { ...SB_HEADERS(), "Prefer":"resolution=merge-duplicates,return=representation" },
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async patch(table, query, data) {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}${query}`, {
      method:"PATCH", headers: SB_HEADERS(), body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
};

async function loadAll() {
  const [users, matchResults, picks, settings, extraMatches] = await Promise.all([
    supabase.get("users","?select=id,name,is_admin,champion,scorer,created_at&order=created_at"),
    supabase.get("match_results","?select=*"),
    supabase.get("picks","?select=*"),
    supabase.get("settings","?select=*"),
    supabase.get("extra_matches","?select=*").catch(()=>[]),
  ]);

  DB.users = users;

  const resultMap = Object.fromEntries(matchResults.map(r=>[r.match_id,r]));

  const baseMatches = MATCHES.map(m => {
    const r = resultMap[m.id];
    return { ...m, result: r?{homeScore:r.home_score,awayScore:r.away_score}:null, winner:r?.winner||null, done:r?.done||false };
  });
  const extraConverted = (extraMatches||[]).map(e => {
    const r = resultMap[e.match_id];
    return { id:e.match_id, phase:e.phase, day:e.day, timeISO:e.time_iso, home:e.home, homeFlag:e.home_flag, away:e.away, awayFlag:e.away_flag,
             result:r?{homeScore:r.home_score,awayScore:r.away_score}:null, winner:r?.winner||null, done:r?.done||false };
  });
  const extraIds = new Set(extraConverted.map(m=>m.id));
  DB.matches = [...baseMatches.filter(m=>!extraIds.has(m.id)), ...extraConverted]
    .sort((a,b)=>new Date(a.timeISO)-new Date(b.timeISO));

  DB.picks = picks;
  const cs = settings.find(s=>s.key==="champion_winner");
  DB.championWinner = cs?.value||null;
  const ss = settings.find(s=>s.key==="scorer_winner");
  DB.scorerWinner = ss?.value||null;

  // Cargar picks de goleador: intentar desde columna users, luego desde settings
  // Construir mapa de scorer_pick_* desde settings para acceso O(1)
  const scorerPickMap = {};
  settings.forEach(s => {
    if (s.key && s.key.startsWith("scorer_pick_")) {
      const uid = s.key.replace("scorer_pick_", "");
      // value puede ser string directo o JSON con comillas — normalizar
      let val = s.value;
      if (typeof val === "string" && val.startsWith('"')) {
        try { val = JSON.parse(val); } catch(e) {}
      }
      if (val && typeof val === "string" && val.length > 0) {
        scorerPickMap[uid] = val;
      }
    }
  });

  // Prioridad 3: picks con match_id="scorer_pick" (último recurso)
  const scorerFromPicks = {};
  picks.filter(p => p.match_id === "scorer_pick" && p.ot).forEach(p => {
    scorerFromPicks[p.user_id] = p.ot;
  });

  DB.users.forEach(u => {
    // Prioridad 1: columna scorer en tabla users
    if (u.scorer && typeof u.scorer === "string" && u.scorer.length > 0) return;
    // Prioridad 2: settings scorer_pick_{userId}
    if (scorerPickMap[u.id]) { u.scorer = scorerPickMap[u.id]; return; }
    // Prioridad 3: picks con match_id especial
    if (scorerFromPicks[u.id]) { u.scorer = scorerFromPicks[u.id]; return; }
    // Sin pick
    u.scorer = null;
  });

  // Sincronizar currentUser si ya está logueado
  if (currentUser?.id) {
    const fresh = DB.users.find(u => u.id === currentUser.id);
    if (fresh) currentUser.scorer = fresh.scorer || null;
  }
  const bs = settings.find(s=>s.key==="banned_names");
  DB.bannedNames = bs?.value ? JSON.parse(bs.value) : [];
}

/* ── PUNTUACIÓN ──────────────────────────────────────────────────────────── */
function calcPickPts(pick, match) {
  if (!match.done||!match.result) return {ot:0,exact:0,advance:0,total:0};
  const {homeScore:rh,awayScore:ra} = match.result;
  const realOT = rh>ra?"1":rh===ra?"X":"2";

  const ph=parseInt(pick?.home_score), pa=parseInt(pick?.away_score);
  const hasScore = !isNaN(ph) && !isNaN(pa);

  // OT siempre derivado del marcador apostado (ignora pick.ot guardado)
  // Si no hay marcador pero hay ot guardado (picks legacy), usa pick.ot como fallback
  let pickOT;
  if (hasScore) {
    pickOT = ph>pa?"1":ph===pa?"X":"2";
  } else if (pick?.ot) {
    pickOT = pick.ot;   // fallback para picks sin marcador
  } else {
    return {ot:0,exact:0,advance:0,total:0};
  }

  const otOk    = pickOT===realOT;
  const exactOk = hasScore && ph===rh && pa===ra;

  // Clasificado: independiente del 1X2
  let advanceOk = false;
  if (match.winner) {
    if (pickOT==="X") {
      // Empate apostado: requiere advance explícito
      advanceOk = !!pick?.advance && pick.advance===match.winner;
    } else {
      // Victoria apostada: el clasificado implícito es el ganador según marcador
      const pw = hasScore ? (ph>pa?"home":"away") : (pick?.ot==="1"?"home":"away");
      advanceOk = pw===match.winner;
    }
  }

  const pts_ot=otOk?1:0, pts_exact=exactOk?3:0, pts_adv=advanceOk?1:0;
  return {ot:pts_ot,exact:pts_exact,advance:pts_adv,total:pts_ot+pts_exact+pts_adv};
}

function calcUserStats(user) {
  let pts=0,ot=0,exact=0,advance=0,champ=0;
  DB.matches.forEach(m=>{
    if(!m.done)return;
    const pick=DB.picks.find(p=>p.user_id===user.id&&p.match_id===m.id);
    const p=calcPickPts(pick,m);
    ot+=p.ot; exact+=p.exact; advance+=p.advance; pts+=p.total;
  });
  if(DB.championWinner&&user.champion===DB.championWinner){champ=5;pts+=5;}
  let scorerPts=0;
  if(DB.scorerWinner&&user.scorer===DB.scorerWinner){scorerPts=5;pts+=5;}
  return {pts,ot,exact,advance,champ,scorerPts};
}

// Puntos de un usuario en una fase específica
function calcUserPhaseStats(user, phase) {
  let pts=0,ot=0,exact=0,advance=0;
  DB.matches.filter(m=>(m.phase||"General")===phase&&m.done).forEach(m=>{
    const pick=DB.picks.find(p=>p.user_id===user.id&&p.match_id===m.id);
    const p=calcPickPts(pick,m);
    ot+=p.ot; exact+=p.exact; advance+=p.advance; pts+=p.total;
  });
  return {pts,ot,exact,advance};
}

function calcRanking() {
  return DB.users.map(u=>({...u,...calcUserStats(u)}))
    .sort((a,b)=>b.pts-a.pts||b.exact-a.exact||b.ot-a.ot||a.name.localeCompare(b.name));
}

// Racha positiva y negativa
function calcStreaks(user) {
  const played = DB.matches.filter(m=>m.done&&m.result)
    .sort((a,b)=>new Date(a.timeISO)-new Date(b.timeISO));
  let pos=0, neg=0;
  for (let i=played.length-1;i>=0;i--) {
    const m=played[i];
    const pick=DB.picks.find(p=>p.user_id===user.id&&p.match_id===m.id);
    if(!pick?.ot){neg++;if(pos>0)break;continue;}
    const p=calcPickPts(pick,m);
    if(p.total>0){pos++;if(neg>0)break;}
    else{neg++;if(pos>0)break;}
    if(pos>0&&neg>0)break;
  }
  return {pos,neg};
}

async function doLogin() {

  const code = document.getElementById("loginCode").value.trim().toLowerCase();
  if (!name) { showToast("Ingresa tu nombre","error"); return; }
  if (code!==CONFIG.GROUP_CODE.toLowerCase()&&code!==CONFIG.ADMIN_CODE.toLowerCase()) {

  }
  const isAdmin = code===CONFIG.ADMIN_CODE.toLowerCase();

  if (btn){btn.disabled=true;btn.textContent="Conectando...";}
  try {
    const users = await supabase.get("users","?order=created_at");
    DB.users=users;
    if (btn){btn.disabled=false;btn.textContent="ENTRAR A LA QUINIELA →";}
    // Lista negra
    const banned=(DB.bannedNames||[]).map(n=>n.toLowerCase());
    if(banned.includes(name.toLowerCase())){
      showToast("Este nombre fue removido del grupo. Contacta al organizador.","error"); return;
    }
    const existing=DB.users.find(u=>u.name.toLowerCase()===name.toLowerCase());
    if(existing){await loginProceed(existing,isAdmin);return;}
    const suggestions=fuzzyMatchUsers(name,DB.users);
    _loginPending={name,code,isAdmin};
    showNameConfirmModal(name,suggestions);
  } catch(e) {
    if(btn){btn.disabled=false;btn.textContent="ENTRAR A LA QUINIELA →";}
    showToast("Error al conectar. Intenta de nuevo.","error"); console.error(e);
  }
}

function levenshtein(a,b) {
  a=a.toLowerCase();b=b.toLowerCase();
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function fuzzyMatchUsers(typed,users) {
  return users.map(u=>{
    const dist=levenshtein(typed,u.name);
    const maxLen=Math.max(typed.length,u.name.length);
    const score=1-dist/maxLen;
    const boost=u.name.toLowerCase().startsWith(typed.toLowerCase().slice(0,3))||
                u.name.toLowerCase().includes(typed.toLowerCase())||
                typed.toLowerCase().includes(u.name.toLowerCase().slice(0,4));
    return{user:u,score,boost};
  }).filter(r=>r.score>=0.45||r.boost)
    .sort((a,b)=>(b.score+(b.boost?0.5:0))-(a.score+(a.boost?0.5:0)))
    .slice(0,4).map(r=>({...r.user,score:r.score}));
}

function showNameConfirmModal(typed,suggestions) {
  // Modal simple con confirm nativo para mantener el código compacto
  const hasSugg = suggestions.length>0;
  if(hasSugg) {
    const names = suggestions.map((s,i)=>`${i+1}. ${s.name}`).join("\n");
    const choice = prompt(`"${typed}" no está registrado.\n\n¿Quisiste decir alguno de estos?\n${names}\n\nEscribe el número o deja en blanco para crear cuenta nueva:`);
    if(choice===null){_loginPending={};return;}
    const idx=parseInt(choice)-1;
    if(idx>=0&&idx<suggestions.length){loginAsSuggested(suggestions[idx].id);return;}
  } else {
    if(!confirm(`"${typed}" no está registrado en el grupo.\n\n¿Deseas crear una cuenta nueva con este nombre?`)){
      _loginPending={};return;
    }
  }
  loginConfirmNew();
}

async function loginAsSuggested(userId) {
  const user=DB.users.find(u=>u.id===userId);
  if(!user)return;
  await loginProceed(user,_loginPending.isAdmin);
}

async function loginConfirmNew() {
  const{name,isAdmin}=_loginPending;
  const banned=(DB.bannedNames||[]).map(n=>n.toLowerCase());
  if(banned.includes(name.toLowerCase())){showToast("Este nombre fue removido del grupo.","error");return;}
  showLoading("Creando cuenta...");
  try {
    const result=await supabase.upsert("users",{name,is_admin:isAdmin});
    const created=Array.isArray(result)?result[0]:result;
    if(!created?.id)throw new Error("No se pudo crear el usuario");
    DB.users.push(created);
    await loginProceed(created,isAdmin);
  } catch(e){hideLoading();showToast("Error al crear la cuenta","error");console.error(e);}
}

async function loginProceed(user,isAdmin) {
  currentUser={...user};
  if(isAdmin&&!user.is_admin){
    await supabase.patch("users",`?id=eq.${user.id}`,{is_admin:true});
    currentUser.is_admin=true;
  }
  sessionStorage.setItem("qm26_uid",currentUser.id);
  showLoading("Cargando datos...");
  await loadAll();
  hideLoading();
  bootApp();
}



/* ═══════════════════════════════════════════════════════════════
   COMPARADOR: IMAGEN PARA COMPARTIR (Canvas API)
═══════════════════════════════════════════════════════════════ */
function shareCompareImage(idA, idB) {
  const uA = DB.users.find(u=>u.id===idA);
  const uB = DB.users.find(u=>u.id===idB);
  if (!uA || !uB) return;

  const sA = calcUserStats(uA), sB = calcUserStats(uB);
  const rankAll = calcRanking();
  const rankA   = rankAll.findIndex(u=>u.id===idA)+1;
  const rankB   = rankAll.findIndex(u=>u.id===idB)+1;
  const ctA     = CHAMPION_TEAMS.find(t=>t.id===uA.champion);
  const ctB     = CHAMPION_TEAMS.find(t=>t.id===uB.champion);
  const spA     = SCORER_PLAYERS.find(p=>p.id===uA.scorer);
  const spB     = SCORER_PLAYERS.find(p=>p.id===uB.scorer);

  // Top 3 partidos con mayor diferencia de puntos entre ambos
  const played = DB.matches
    .filter(m=>m.done&&m.result)
    .sort((a,b)=>new Date(a.timeISO)-new Date(b.timeISO));

  const diffs = played.map(m=>{
    const pickA = DB.picks.find(p=>p.user_id===idA&&p.match_id===m.id);
    const pickB = DB.picks.find(p=>p.user_id===idB&&p.match_id===m.id);
    const pA = calcPickPts(pickA,m).total;
    const pB = calcPickPts(pickB,m).total;
    return { m, pA, pB, diff: Math.abs(pA-pB) };
  }).filter(d=>d.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,3);

  // ── Canvas ────────────────────────────────────────────────────
  const W = 600, PAD = 28;
  const ROWS_STATS = 5; // pts, pos, exactos, campeón, goleador
  const ROW_H = 46;
  const DIFF_H = diffs.length > 0 ? 30 + diffs.length * 52 : 0;
  const H = PAD + 90 + ROWS_STATS * ROW_H + (diffs.length > 0 ? 36 + DIFF_H : 0) + PAD + 40;

  const canvas = document.getElementById("cmpCanvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // Helpers
  const hex  = v => v;
  const col  = { bg:"#0a1628", gray1:"#1c1c2e", gray2:"#2a2a3e", gray3:"#3d3d55",
                  gold:"#f4c430", muted:"#8888aa", white:"#f5f5f0",
                  success:"#4caf87", danger:"#e05252" };

  // Fondo
  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, W, H);
  // Borde dorado top/bottom
  ctx.fillStyle = col.gold;
  ctx.fillRect(0,0,W,5);
  ctx.fillRect(0,H-5,W,5);

  // Título
  ctx.fillStyle = col.gold;
  ctx.font = "bold 20px 'Arial Narrow', Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⚽ QUINIELA MUNDIAL 2026 — COMPARATIVA", W/2, PAD+28);

  // Fecha
  ctx.fillStyle = col.muted;
  ctx.font = "13px Arial, sans-serif";
  ctx.fillText(new Date().toLocaleDateString("es-CL",{day:"2-digit",month:"long",year:"numeric"}), W/2, PAD+48);

  // Header nombres
  const hY = PAD + 68;
  ctx.fillStyle = col.gray2;
  ctx.fillRect(PAD, hY, W-PAD*2, 36);
  ctx.font = "bold 16px Arial, sans-serif";
  ctx.fillStyle = col.white;
  ctx.textAlign = "left";
  ctx.fillText(uA.name, PAD+12, hY+24);
  ctx.textAlign = "right";
  ctx.fillText(uB.name, W-PAD-12, hY+24);
  ctx.fillStyle = col.muted;
  ctx.font = "13px Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("VS", W/2, hY+24);

  // Separador
  ctx.strokeStyle = col.gray3;
  ctx.lineWidth = 1;

  // Filas de stats
  const statsData = [
    { lbl:"PUNTOS TOTALES", a:sA.pts, b:sB.pts, fmt:v=>`${v}` },
    { lbl:"POSICIÓN GLOBAL", a:rankB, b:rankA, fmt:(v,isA)=>isA?`#${rankA}`:`#${rankB}`, flip:true },
    { lbl:"EXACTOS", a:Math.floor(sA.exact/3), b:Math.floor(sB.exact/3), fmt:v=>`${v}` },
    { lbl:"CAMPEÓN", a:0, b:0, txtA:ctA?ctA.id+" "+ctA.name:"–", txtB:ctB?ctB.id+" "+ctB.name:"–", noWin:true },
    { lbl:"GOLEADOR", a:0, b:0, txtA:spA?spA.name:"–", txtB:spB?spB.name:"–", noWin:true },
  ];

  statsData.forEach((row, i) => {
    const y = PAD + 104 + i * ROW_H;
    // Fondo alternado
    if (i%2===0) { ctx.fillStyle = col.gray1; ctx.fillRect(PAD, y, W-PAD*2, ROW_H); }

    // Label central
    ctx.fillStyle = col.muted;
    ctx.font = "bold 9px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(row.lbl, W/2, y+14);

    // Líneas separadoras
    ctx.strokeStyle = col.gray3; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(W/2-50, y); ctx.lineTo(W/2-50, y+ROW_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+50, y); ctx.lineTo(W/2+50, y+ROW_H); ctx.stroke();

    if (row.noWin) {
      ctx.font = "12px Arial, sans-serif";
      ctx.fillStyle = col.muted;
      ctx.textAlign = "left";
      ctx.fillText(row.txtA, PAD+12, y+ROW_H/2+5);
      ctx.textAlign = "right";
      ctx.fillText(row.txtB, W-PAD-12, y+ROW_H/2+5);
    } else {
      const winA = row.flip ? rankA<rankB : row.a>row.b;
      const winB = row.flip ? rankB<rankA : row.b>row.a;
      const valA = row.flip ? `#${rankA}` : `${row.a}`;
      const valB = row.flip ? `#${rankB}` : `${row.b}`;
      ctx.font = "bold 22px 'Arial Narrow', Arial, sans-serif";
      ctx.fillStyle = winA ? col.success : winB ? col.danger : col.gold;
      ctx.textAlign = "left";
      ctx.fillText(valA, PAD+12, y+ROW_H/2+8);
      ctx.fillStyle = winB ? col.success : winA ? col.danger : col.gold;
      ctx.textAlign = "right";
      ctx.fillText(valB, W-PAD-12, y+ROW_H/2+8);
    }
  });

  // Partidos con mayor diferencia
  if (diffs.length > 0) {
    const secY = PAD + 104 + ROWS_STATS * ROW_H + 16;
    ctx.fillStyle = col.gray2;
    ctx.fillRect(PAD, secY, W-PAD*2, 26);
    ctx.font = "bold 9px Arial, sans-serif";
    ctx.fillStyle = col.gold;
    ctx.textAlign = "center";
    ctx.fillText("PARTIDOS CON MAYOR DIFERENCIA", W/2, secY+18);

    diffs.forEach((d, i) => {
      const ry = secY + 30 + i * 52;
      if (i%2===0) { ctx.fillStyle = col.gray1; ctx.fillRect(PAD, ry, W-PAD*2, 50); }

      // Nombre del partido
      const matchLabel = `${d.m.homeFlag} ${d.m.home} vs ${d.m.away} ${d.m.awayFlag}`;
      const resultLabel = `${d.m.result.homeScore} – ${d.m.result.awayScore}`;
      ctx.font = "bold 11px Arial, sans-serif";
      ctx.fillStyle = col.white;
      ctx.textAlign = "center";
      ctx.fillText(matchLabel, W/2, ry+15);
      ctx.font = "10px Arial, sans-serif";
      ctx.fillStyle = col.muted;
      ctx.fillText(resultLabel, W/2, ry+29);

      // Puntos de cada jugador
      ctx.font = "bold 20px 'Arial Narrow', Arial, sans-serif";
      ctx.fillStyle = d.pA>d.pB ? col.success : d.pA<d.pB ? col.danger : col.muted;
      ctx.textAlign = "left";
      ctx.fillText(`${d.pA} pts`, PAD+12, ry+34);
      ctx.fillStyle = d.pB>d.pA ? col.success : d.pB<d.pA ? col.danger : col.muted;
      ctx.textAlign = "right";
      ctx.fillText(`${d.pB} pts`, W-PAD-12, ry+34);
    });
  }

  // Footer
  ctx.fillStyle = col.muted;
  ctx.font = "10px Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Quiniela Mundial 2026", W/2, H-PAD+8);

  // Descargar
  const link = document.createElement("a");
  link.download = `comparativa-${uA.name.replace(/\s/g,"-")}-vs-${uB.name.replace(/\s/g,"-")}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  showToast("✅ Imagen descargada — ¡compártela en WhatsApp!", "success");
}

/* ═══════════════════════════════════════════════════════════════
   HISTORIAL DE POSICIONES POR FASE
═══════════════════════════════════════════════════════════════ */
function generatePosHistory(user, currentRanking) {
  const phases = [...new Set(DB.matches.map(m=>m.phase||"General"))];
  phases.sort((a,b)=>PHASE_ORDER.indexOf(a)-PHASE_ORDER.indexOf(b));

  // Solo fases con al menos un partido finalizado
  const donePhases = phases.filter(ph =>
    DB.matches.some(m=>(m.phase||"General")===ph && m.done)
  );
  if (donePhases.length < 1) return "";

  // Calcular posición acumulada al cierre de cada fase
  const steps = donePhases.map(phase => {
    // Puntos acumulados hasta el final de esta fase (inclusive)
    const phaseIdx = PHASE_ORDER.indexOf(phase);
    const phasesUpTo = PHASE_ORDER.slice(0, phaseIdx + 1);
    const snapshot = DB.users.map(u => {
      let pts = 0;
      DB.matches
        .filter(m => phasesUpTo.includes(m.phase||"General") && m.done)
        .forEach(m => {
          const pick = DB.picks.find(p=>p.user_id===u.id&&p.match_id===m.id);
          pts += calcPickPts(pick,m).total;
        });
      if (DB.championWinner && u.champion===DB.championWinner) pts += 5;
      return { id: u.id, pts };
    }).sort((a,b) => b.pts - a.pts);

    const pos = snapshot.findIndex(u=>u.id===user.id) + 1;
    return { phase, pos };
  });

  const posBadgeClass = pos => pos===1?"p1":pos===2?"p2":pos===3?"p3":pos<=5?"top":"";

  const stepHtml = steps.map((s, i) => {
    const arrow = i < steps.length-1
      ? `<span class="pos-history-arrow">${steps[i+1].pos < s.pos?"▲":steps[i+1].pos > s.pos?"▼":"—"}</span>`
      : "";
    return `
      <div class="pos-history-step">
        <div class="pos-history-phase">${s.phase}</div>
        <div class="pos-badge ${posBadgeClass(s.pos)}">${s.pos}</div>
      </div>${arrow}`;
  }).join("");

  return `
    <div class="pos-history-wrap">
      <div class="pos-history-title">HISTORIAL DE POSICIONES</div>
      <div class="pos-history-track">${stepHtml}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   RESUMEN DE FASE (Admin)
═══════════════════════════════════════════════════════════════ */
function renderPhaseSummaries() {
  const phases = [...new Set(DB.matches.map(m=>m.phase||"General"))];
  phases.sort((a,b)=>PHASE_ORDER.indexOf(a)-PHASE_ORDER.indexOf(b));

  return phases.map(phase => {
    const pMatches = DB.matches.filter(m=>(m.phase||"General")===phase);
    const done     = pMatches.every(m=>m.done);
    const doneCnt  = pMatches.filter(m=>m.done).length;
    if (doneCnt === 0) return "";

    // Ranking de la fase
    const phaseRanking = DB.users.map(u => {
      const ps = calcUserPhaseStats(u, phase);
      return { ...u, ...ps };
    }).sort((a,b) => b.pts-a.pts || b.exact-a.exact || a.name.localeCompare(b.name));

    const medals = ["🥇","🥈","🥉"];
    const rows = phaseRanking.map((u,i) => `
      <div class="phase-summary-row">
        <span class="phase-summary-pos ${i<3?"top":""}">${medals[i]||i+1}</span>
        <span class="phase-summary-name">${u.name}</span>
        <span class="phase-summary-exact">${Math.floor(u.exact/3)} exactos</span>
        <span class="phase-summary-pts">${u.pts}</span>
      </div>`).join("");

    const status = done ? "COMPLETA" : `${doneCnt}/${pMatches.length} jugados`;

    return `
      <div class="phase-summary-card">
        <div class="phase-summary-title">
          <span>${phase} <span style="font-size:10px;color:var(--muted);font-weight:400">${status}</span></span>
          <button class="phase-summary-copy-btn" onclick="copyPhaseSummary('${phase}')">📋 Copiar</button>
        </div>
        ${rows}
      </div>`;
  }).filter(Boolean).join("");
}

function copyPhaseSummary(phase) {
  const pMatches = DB.matches.filter(m=>(m.phase||"General")===phase);
  const phaseRanking = DB.users.map(u => {
    const ps = calcUserPhaseStats(u, phase);
    return { ...u, ...ps };
  }).sort((a,b) => b.pts-a.pts || b.exact-a.exact || a.name.localeCompare(b.name));

  const medals = ["🥇","🥈","🥉"];
  let text = `⚽ *QUINIELA MUNDIAL 2026*\n`;
  text += `📊 Resumen ${phase}\n`;
  text += `${"─".repeat(22)}\n`;
  phaseRanking.forEach((u,i) => {
    text += `${medals[i]||`${i+1}.`} ${u.name} — *${u.pts} pts*`;
    if (Math.floor(u.exact/3) > 0) text += ` (${Math.floor(u.exact/3)} exacto${Math.floor(u.exact/3)>1?"s":""})`;
    text += "\n";
  });
  text += `\n_¡A por la siguiente fase!_`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(()=>showToast("✅ Resumen copiado — pégalo en WhatsApp","success"))
      .catch(()=>_fallbackCopyText(text));
  } else { _fallbackCopyText(text); }
}

function _fallbackCopyText(text) {
  const ta=document.createElement("textarea");ta.value=text;
  ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");showToast("✅ Copiado","success");}
  catch{showToast("No se pudo copiar","error");}
  document.body.removeChild(ta);
}

/* ═══════════════════════════════════════════════════════════════
   PICKS PENDIENTES (Admin)
═══════════════════════════════════════════════════════════════ */
function renderPendingPicks() {
  // Partidos próximos o en curso con picks faltantes
  const upcoming = DB.matches
    .filter(m => !m.done)
    .sort((a,b) => new Date(a.timeISO) - new Date(b.timeISO));

  if (!upcoming.length) return `<div style="font-size:11px;color:var(--muted);padding:8px 0">No hay partidos pendientes.</div>`;

  return upcoming.map(m => {
    const missing = DB.users.filter(u => {
      const pick = DB.picks.find(p=>p.user_id===u.id&&p.match_id===m.id);
      return !pick?.ot;
    });
    const locked    = isLocked(m);
    const accId     = `pend_${m.id}`;
    const allOk     = missing.length === 0;
    const metaColor = locked ? "var(--muted)" : allOk ? "var(--success)" : "var(--danger)";
    const metaTxt   = locked
      ? "CERRADO"
      : allOk
        ? "✅ Todos apostaron"
        : `⚠️ ${missing.length} sin apostar`;

    const body = allOk
      ? `<div class="pending-all-ok">✅ Todos los jugadores registraron su pick.</div>`
      : `<div class="pending-names">${missing.map(u=>`<span class="pending-name-chip">${u.name}</span>`).join("")}</div>`;

    return `
      <div class="pending-accordion">
        <div class="pending-acc-header" onclick="togglePendingAcc('${accId}')">
          <div>
            <span class="pending-acc-title">${m.homeFlag} ${m.home} vs ${m.away} ${m.awayFlag}</span>
            <span style="font-size:9px;color:var(--muted);margin-left:6px">${m.day} · ${fmtTime(m.timeISO)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:10px;color:${metaColor};font-weight:700">${metaTxt}</span>
            <span class="pending-acc-arrow" id="parr2_${accId}">▼</span>
          </div>
        </div>
        <div class="pending-acc-body" id="${accId}">${body}</div>
      </div>`;
  }).join("");
}

function togglePendingAcc(id) {
  const body  = document.getElementById(id);
  const arrow = document.getElementById(`parr2_${id}`);
  if (!body) return;
  const open = body.classList.contains("open");
  body.classList.toggle("open", !open);
  if (arrow) arrow.classList.toggle("open", !open);
}


/* ═══════════════════════════════════════════════════════════════
   SUGERENCIA 1 — Banner de cierre inminente
═══════════════════════════════════════════════════════════════ */
function renderClosingBanner() {
  const el = document.getElementById("todayStrip");
  if (!el) return;

  // Partidos que cierran en los próximos 60 min sin pick del usuario
  const urgent = DB.matches.filter(m => {
    if (isLocked(m) || m.done) return false;
    const diff = (new Date(m.timeISO) - new Date()) / 60000;
    if (diff > 60) return false;
    const pick = DB.picks.find(p => p.user_id === currentUser.id && p.match_id === m.id);
    return !pick?.ot;
  });

  if (urgent.length === 0) {
    renderTodayStrip(); // mostrar vista del día en su lugar
    return;
  }

  const names = urgent.map(m => `${m.homeFlag} vs ${m.awayFlag}`).join(", ");
  const minLeft = Math.round((new Date(urgent[0].timeISO) - new Date()) / 60000);

  el.innerHTML = `
    <div class="closing-banner" onclick="scrollToMatch('${urgent[0].id}')">
      <span class="closing-banner-icon">⚠️</span>
      <div class="closing-banner-text">
        <b>${urgent.length} partido${urgent.length>1?"s":""}  sin tu pronóstico</b>
        <span>${names} · cierra${urgent.length>1?"n":""} en ~${minLeft} min</span>
      </div>
      <span class="closing-banner-cta">IR →</span>
    </div>`;

  // Después del banner también mostrar la vista del día
  el.innerHTML += renderTodayStripHtml();
}

function scrollToMatch(matchId) {
  // Abrir el acordeón correspondiente y hacer scroll
  const card = document.getElementById(`card_${matchId}`);
  if (card) { card.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  // Si está dentro de un acordeón colapsado, intentar abrirlo
  DB.matches.forEach(m => {
    if (m.id !== matchId) return;
    const phase = m.phase || "General";
    const accId = `pacc_${phase.replace(/[^a-z0-9]/gi,"")}`;
    const body  = document.getElementById(accId);
    const arrow = document.getElementById(`parr_${accId}`);
    if (body && body.style.display === "none") {
      body.style.display = "block";
      if (arrow) arrow.style.transform = "rotate(180deg)";
    }
    setTimeout(() => {
      const c2 = document.getElementById(`card_${matchId}`);
      if (c2) c2.scrollIntoView({ behavior:"smooth", block:"center" });
    }, 100);
  });
}

/* ═══════════════════════════════════════════════════════════════
   SUGERENCIA 3 — Vista rápida del día
═══════════════════════════════════════════════════════════════ */
function renderTodayStripHtml() {
  const today = new Date();
  const todayMatches = DB.matches.filter(m => {
    const d = new Date(m.timeISO);
    return d.getFullYear() === today.getFullYear() &&
           d.getMonth()    === today.getMonth()    &&
           d.getDate()     === today.getDate();
  });
  if (!todayMatches.length) return "";

  const rows = todayMatches.map(m => {
    const pick   = DB.picks.find(p => p.user_id === currentUser.id && p.match_id === m.id);
    const ph     = parseInt(pick?.home_score), pa = parseInt(pick?.away_score);
    const hasScore = !isNaN(ph) && !isNaN(pa);
    const pickOT = hasScore ? (ph>pa?"1":ph===pa?"X":"2") : pick?.ot;

    let pickLabel = "", pickCls = "";
    if (m.done) {
      const p = calcPickPts(pick, m);
      pickLabel = pick?.ot ? `${p.total} pts` : "Sin pick";
      pickCls   = "today-pick-done";
    } else if (isLocked(m)) {
      pickLabel = pick?.ot ? "✓ Registrado" : "Sin pick";
      pickCls   = pick?.ot ? "today-pick-ok" : "today-pick-none";
    } else {
      pickLabel = pick?.ot ? "✓ Guardado" : "⚠ Pendiente";
      pickCls   = pick?.ot ? "today-pick-ok" : "today-pick-none";
    }

    return `<div class="today-match-row" onclick="scrollToMatch('${m.id}')">
      <span class="today-match-time">${fmtTime(m.timeISO)}</span>
      <span class="today-match-teams">${m.homeFlag} ${m.home} vs ${m.away} ${m.awayFlag}</span>
      <span class="today-match-pick ${pickCls}">${pickLabel}</span>
    </div>`;
  }).join("");

  return `<div class="today-strip">
    <div class="today-strip-title">HOY</div>
    ${rows}
  </div>`;
}

function renderTodayStrip() {
  const el = document.getElementById("todayStrip");
  if (el) el.innerHTML = renderTodayStripHtml();
}

/* ═══════════════════════════════════════════════════════════════
   SUGERENCIA 4 — Toast de resultado por partido
═══════════════════════════════════════════════════════════════ */
let _prevMatchStates = {};
let _resultToastTimer = null;

function checkNewResults() {
  DB.matches.forEach(m => {
    if (!m.done) return;
    const wasKnown = _prevMatchStates[m.id];
    if (wasKnown) return; // ya se notificó
    _prevMatchStates[m.id] = true;

    const pick = DB.picks.find(p => p.user_id === currentUser.id && p.match_id === m.id);
    const p    = calcPickPts(pick, m);

    const toast  = document.getElementById("resultToast");
    const label  = document.getElementById("resultToastLabel");
    const pts    = document.getElementById("resultToastPts");
    const match  = document.getElementById("resultToastMatch");
    if (!toast) return;

    clearTimeout(_resultToastTimer);
    const scored = p.total > 0;
    toast.className = `result-toast ${scored?"win":"loss"}`;
    label.textContent  = scored ? "¡Sumaste puntos!" : "Esta vez no";
    pts.textContent    = `+${p.total} pts`;
    pts.className      = `result-toast-pts ${p.total===0?"zero":""}`;
    match.textContent  = `${m.homeFlag} ${m.home} ${m.result?.homeScore??""} – ${m.result?.awayScore??""} ${m.away} ${m.awayFlag}`;

    // Mostrar solo si el resultado es nuevo (no al abrir la app por primera vez)
    if (Object.keys(_prevMatchStates).length > 1) {
      toast.classList.add("visible");
      _resultToastTimer = setTimeout(() => toast.classList.remove("visible"), 4000);
    }
  });
}

function bootApp() {
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appShell").style.display="block";
  document.getElementById("headerUsername").textContent=currentUser.name;
  if(currentUser.is_admin){

  if(savedTheme==="light")document.body.classList.add("light");
  document.getElementById("themeToggle").textContent=savedTheme==="light"?"🌙":"☀️";

  renderClosingBanner();

  DB.matches.forEach(m=>{ if(m.done)_prevMatchStates[m.id]=true; });
